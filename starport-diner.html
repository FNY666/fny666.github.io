<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星港餐站</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08060d;color:#fff5f7;font-family:system-ui,-apple-system,PingFang SC,sans-serif}body{overflow:auto}#app{min-height:100vh;padding:15px 14px 28px;background:radial-gradient(circle at 50% 0,#40203e,#120b19 46%,#06050a)}.top{max-width:920px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:start}.logo{font-size:clamp(32px,8vw,62px);font-weight:900;letter-spacing:.11em;color:#ff9ac8;text-shadow:0 0 15px #ff3d9e}.sub{margin-top:4px;color:#cfb5d8;font:11px monospace;letter-spacing:.2em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{padding:8px 9px;border:1px solid #774c75;border-radius:10px;background:#1a1024;color:#ffd4eb;font:800 11px monospace}.back{position:fixed;right:12px;top:10px;z-index:7;padding:9px 12px;border:1px solid #ff8dc9;border-radius:999px;background:#5d1747;color:#fff;font-weight:800}.layout{max-width:920px;margin:19px auto 0;display:grid;grid-template-columns:1fr .9fr;gap:14px}.station,.orders{border:1px solid #694462;border-radius:18px;background:linear-gradient(145deg,#21172d,#0f0b17);box-shadow:0 12px 30px #0008}.station{padding:18px}.station h2,.orders h2{margin:0 0 12px;color:#ffb1d7;font-size:19px}.machine{border:1px solid #ad5b91;border-radius:15px;background:#160e22;padding:15px;text-align:center;min-height:215px}.dish{height:100px;width:100px;margin:0 auto 12px;border-radius:50%;border:2px solid #ff86c3;background:radial-gradient(circle,#fff3fa 0 5%,#ff8ec8 8% 23%,#632e73 53%,#170b23 56%);box-shadow:0 0 30px #ff4cbd66;display:grid;place-items:center;color:#ffe45e;font-size:34px}.dish.cooking{animation:spin .65s linear infinite}.recipe{min-height:28px;color:#e7c9dc;font:11px monospace;line-height:1.6}.ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.ingredient{padding:10px 5px;border:1px solid #855174;border-radius:10px;background:#24132e;color:#ffd8ec;font-weight:800;font-size:12px;touch-action:manipulation}.ingredient:active,.ingredient.selected{background:#8a3e70;border-color:#ff9bc9}.cook{width:100%;margin-top:12px;padding:12px;border:1px solid #ffe45e;border-radius:999px;background:#695016;color:#fff4bb;font-weight:900}.orders{padding:14px}.orders h2{display:flex;justify-content:space-between}.order{position:relative;margin-bottom:9px;padding:11px;border:1px solid #4d385d;border-radius:12px;background:#140e20;cursor:pointer}.order.selected{border-color:#ff9bc9;box-shadow:0 0 18px #ff45b744}.order.done{opacity:.45}.order h3{margin:0 0 4px;color:#fff;font-size:14px}.order p{margin:3px 0;color:#bea6c6;font-size:11px;line-height:1.5}.patience{position:absolute;right:10px;top:11px;color:#ffb4d7;font:800 11px monospace}.bar{height:5px;margin-top:7px;background:#3a203a;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4f9d,#ffe45e);width:100%}.log{max-width:920px;margin:13px auto;padding:12px;border-left:3px solid #ffe45e;background:#171027;color:#d2b9dc;font:11px monospace;min-height:42px}.panel-ui{max-width:920px;margin:10px auto;color:#a98caf;font:11px monospace}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#06040bdd;text-align:center}.box{width:min(90vw,440px);padding:30px;border:1px solid #ff8dc9;border-radius:20px;background:linear-gradient(145deg,#321536,#0d0915);box-shadow:0 0 46px #ff37a655}.box h1{margin:0;color:#ff9dca;font-size:clamp(40px,11vw,72px);text-shadow:0 0 18px #ff35a5}.box p{color:#d3bdd6;line-height:1.8}.start{padding:13px 30px;border:1px solid #ffe45e;border-radius:999px;background:#76570f;color:#fff4bb;font-weight:900;font-size:16px}.hidden{display:none!important}.rotate{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:10px;right:10px;z-index:8;padding:7px 10px;border:1px solid #ff8dc9;border-radius:999px;background:#35132ddd;font:11px monospace}}@media(max-width:680px){.layout{grid-template-columns:1fr;margin-top:15px}.station{padding:12px}.orders{padding:12px}.hud{max-width:180px}.machine{min-height:198px}.ingredients{gap:6px}.ingredient{padding:10px 2px;font-size:11px}}
</style></head><body><div id="app"><div class="top"><div><div class="logo">星港餐站</div><div class="sub">STARPORT DINER · SHIFT CONTROL</div></div><div class="hud"><span class="stat" id="cycle">SHIFT 01</span><span class="stat" id="score">SCORE 0000</span><span class="stat" id="combo">COMBO 0</span></div></div><button class="back" id="back">返回星港</button><main class="layout"><section class="station"><h2>合成台</h2><div class="machine"><div class="dish" id="dish">✦</div><div class="recipe" id="recipe">选择一份订单开始合成</div><div class="ingredients" id="ingredients"></div><button class="cook" id="cook">完成出餐</button></div></section><section class="orders"><h2><span>待处理订单</span><span id="count">0/8</span></h2><div id="orders"></div></section></main><div class="log" id="log">餐站待命。请接入第一份订单。</div><div class="panel-ui">正确按配方顺序加入材料；顾客耐心会持续下降。<br>连续快速出餐可获得 COMBO 奖励。</div><div class="rotate">横屏管理餐站更清晰 ⟳</div><div id="title" class="panel"><div class="box"><h1>星港餐站</h1><p>STARPORT DINER<br>为穿越星系的旅客制作一份及时的能量料理。</p><button class="start" id="start">开始营业</button><p>点击订单 → 按配方顺序加入材料 → 完成出餐<br>顾客耐心耗尽前，处理尽可能多的订单。</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>打烊</h1><p id="result"></p><button class="start" id="again">重新营业</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const $=id=>document.getElementById(id);const ingredients=[['crystal','量子晶体','◆'],['broth','星云汤底','≈'],['spice','脉冲香料','✦'],['dust','星尘糖','✧'],['ice','冷冻冰','❄'],['berry','红矮星果','●']];const recipes=[{name:'量子拉面',seq:['crystal','broth','spice'],desc:'量子晶体 · 星云汤底 · 脉冲香料',icon:'◆'},{name:'星尘气泡',seq:['dust','ice','berry'],desc:'星尘糖 · 冷冻冰 · 红矮星果',icon:'✧'},{name:'跃迁浓汤',seq:['broth','crystal','ice'],desc:'星云汤底 · 量子晶体 · 冷冻冰',icon:'≈'},{name:'脉冲甜点',seq:['berry','spice','dust'],desc:'红矮星果 · 脉冲香料 · 星尘糖',icon:'●'}];let active=false,score=0,combo=0,shift=1,served=0,best=Number(localStorage.starportDinerBest||0),orders=[],selected=-1,currentSeq=[],last=0;
function reset(){active=true;score=0;combo=0;shift=1;served=0;selected=-1;currentSeq=[];orders=[];last=performance.now();$('title').classList.add('hidden');$('over').classList.add('hidden');for(let i=0;i<4;i++)addOrder();render();hud();log('开始营业。点击订单接单。')}
function addOrder(){const r=recipes[Math.floor(Math.random()*recipes.length)],now=performance.now();orders.push({recipe:r,patience:100,max:100,done:false,created:now})}
function hud(){$('cycle').textContent='SHIFT '+String(shift).padStart(2,'0');$('score').textContent='SCORE '+String(Math.floor(score)).padStart(4,'0');$('combo').textContent='COMBO '+combo;$('count').textContent=served+'/8'}
function log(s){$('log').textContent=s}
function render(){const box=$('orders');box.innerHTML='';orders.forEach((o,i)=>{const e=document.createElement('div');e.className='order'+(i===selected?' selected':'')+(o.done?' done':'');e.innerHTML='<span class="patience">T-'+Math.ceil(o.patience/3)+'s</span><h3>'+o.recipe.icon+' '+o.recipe.name+'</h3><p>'+o.recipe.desc+'</p><div class="bar"><i style="width:'+Math.max(0,o.patience)+'%"></i></div>';e.onclick=()=>select(i);box.appendChild(e)});const r=selected>=0&&!orders[selected].done?orders[selected].recipe:null;$('recipe').textContent=r?(currentSeq.length?'已加入：'+currentSeq.join(' → ')+' / 下一步 '+label(r.seq[currentSeq.length]):'配方：'+r.desc):'选择一份订单开始合成';$('dish').textContent=r?r.icon:'✦';$('ingredients').innerHTML='';ingredients.forEach(([id,name,icon])=>{const b=document.createElement('button');b.className='ingredient';b.textContent=icon+' '+name;b.onclick=()=>addIngredient(id);$('ingredients').appendChild(b)})}
function label(id){const x=ingredients.find(a=>a[0]===id);return x?x[1]:id}
function select(i){if(!active||orders[i]?.done)return;selected=i;currentSeq=[];render();log('已接单：'+orders[i].recipe.name+'，按顺序加入材料。')}
function addIngredient(id){if(!active||selected<0)return;const o=orders[selected];const expected=o.recipe.seq[currentSeq.length];if(id!==expected){combo=0;currentSeq=[];log('配方顺序错误：需要 '+label(expected)+'。');render();return}currentSeq.push(id);render();if(currentSeq.length===o.recipe.seq.length)log('配方完成，点击“完成出餐”。')}
function cook(){if(!active||selected<0)return;const o=orders[selected];if(currentSeq.length!==o.recipe.seq.length){log('还缺少材料，下一步需要 '+label(o.recipe.seq[currentSeq.length])+ '。');return}o.done=true;const quick=Math.ceil(o.patience/10);combo++;score+=100+quick*5+combo*20;served++;best=Math.max(best,score);localStorage.starportDinerBest=best;log('出餐成功：'+o.recipe.name+' · +'+(100+quick*5+combo*20)+' · 连击 '+combo);selected=-1;currentSeq=[];if(served>=8){finish();return}addOrder();render();hud()}
function tick(now){const dt=Math.min(.1,(now-last)/1000||0);last=now;if(active){for(const o of orders)if(!o.done){o.patience-=dt*2.4;if(o.patience<=0){o.patience=0;o.done=true;combo=0;log('订单过期：'+o.recipe.name+' · 连击中断');if(selected===orders.indexOf(o)){selected=-1;currentSeq=[]}}}orders=orders.filter(o=>!o.done||o===orders[selected]);if(orders.filter(o=>!o.done).length<3)addOrder();shift=1+Math.floor(served/4);render();hud()}requestAnimationFrame(tick)}
function finish(){active=false;$('result').textContent='完成订单 '+served+' 份 · 得分 '+Math.floor(score)+' · 最高 '+best;$('over').classList.remove('hidden')}
function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}tap($('start'),reset);tap($('again'),reset);tap($('cook'),cook);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');render();hud();requestAnimationFrame(tick);
</script></body></html>
