<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星港检疫</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050812;color:#eaffff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}body{overflow:auto}#app{min-height:100vh;padding:16px 14px 30px;background:radial-gradient(circle at 50% 0,#1b284b,#080b18 46%,#03050b)}.top{max-width:920px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:start}.logo{font-weight:900;color:#9fffe0;font-size:clamp(30px,7vw,62px);letter-spacing:.1em;text-shadow:0 0 16px #42ffd0}.sub{margin-top:5px;color:#9ab8dd;font:11px monospace;letter-spacing:.2em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{padding:8px 10px;border:1px solid #456e80;border-radius:10px;background:#0b1729;color:#afffea;font:800 11px monospace}.back{position:fixed;right:12px;top:10px;z-index:6;padding:9px 12px;border:1px solid #63f7c4;border-radius:999px;background:#0c4e48;color:#fff;font-weight:800}.layout{max-width:920px;margin:22px auto 0;display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.panel,.card{border:1px solid #31576b;border-radius:18px;background:linear-gradient(145deg,#0e1b32,#070c18);box-shadow:0 12px 30px #0007}.panel{padding:18px}.panel h2{font-size:18px;margin:0 0 13px;color:#9fffe0}.ship{min-height:250px}.ship-id{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2d4561;padding-bottom:12px}.ship-id strong{font-size:24px;color:#fff}.stamp{padding:5px 8px;border:1px solid #ffe45e;border-radius:6px;color:#ffe45e;font:800 10px monospace}.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.row{padding:10px;border-radius:9px;background:#111d31}.row small{display:block;color:#7092aa;font:10px monospace;margin-bottom:4px}.row b{color:#dffaff;font-size:14px}.scan-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.scan{padding:9px 4px;border:1px solid #477e8c;border-radius:9px;background:#0b2631;color:#9fffe0;font-weight:800;font-size:11px}.scan.active{background:#176455;border-color:#7fffd0}.scan-out{min-height:48px;margin-top:9px;padding:10px;border-left:3px solid #ffe45e;background:#121e31;color:#abc8dc;font:11px monospace;line-height:1.6}.rules{color:#b6cbe0;line-height:1.8;font-size:13px}.rules strong{color:#ffe45e}.decision{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.decision button{padding:14px 8px;border-radius:12px;font-size:15px;font-weight:900;color:#fff}.approve{background:#155d4d;border:1px solid #6effc4}.hold{background:#672e4c;border:1px solid #ff76ba}.log{max-width:920px;margin:14px auto;padding:12px 14px;border-left:3px solid #60eaff;background:#0b1729;color:#9bc1d5;font:11px monospace;min-height:44px}.panel-ui{max-width:920px;margin:14px auto;display:flex;justify-content:space-between;color:#779bb3;font:11px monospace}.panel-ui button{padding:8px 12px;border:1px solid #4c7088;border-radius:999px;background:#0c1d30;color:#b9deed}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,440px);padding:30px;border:1px solid #63f7c4;border-radius:20px;background:linear-gradient(145deg,#102d37,#070b18);box-shadow:0 0 44px #22d9a955}.box h1{font-size:clamp(38px,10vw,70px);margin:0;color:#9fffe0;text-shadow:0 0 18px #36ffbd}.box p{color:#aac5d5;line-height:1.8}.start{padding:13px 30px;border:1px solid #63f7c4;border-radius:999px;background:#0d5d51;color:#fff;font-weight:900;font-size:16px}.hidden{display:none!important}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:10px;right:10px;z-index:8;padding:7px 10px;border:1px solid #63f7c4;border-radius:999px;background:#0b2934ee;font:11px monospace}}@media(max-width:680px){.layout{grid-template-columns:1fr;margin-top:18px}.panel{padding:13px}.ship{min-height:0}.hud{max-width:185px}.rows{gap:6px}.row{padding:8px}.panel-ui{margin-top:10px}}
</style></head><body><div id="app"><div class="top"><div><div class="logo">星港检疫</div><div class="sub">STARPORT CUSTOMS · INSPECTION DECK</div></div><div class="hud"><span class="stat" id="day">DAY 01</span><span class="stat" id="score">SCORE 0000</span><span class="stat" id="errors">ERROR 0/3</span></div></div><button class="back" id="back">返回星港</button><main class="layout"><section class="panel ship"><h2>入港飞船</h2><div class="ship-id"><strong id="shipId">—</strong><span class="stamp" id="shipType">待扫描</span></div><div class="rows"><div class="row"><small>船长</small><b id="captain">—</b></div><div class="row"><small>来源区</small><b id="origin">—</b></div><div class="row"><small>通行证</small><b id="pass">—</b></div><div class="row"><small>货舱声明</small><b id="cargo">—</b></div></div><div class="scan-tabs"><button class="scan active" data-scan="doc">证件核验</button><button class="scan" data-scan="cargo">货舱扫描</button><button class="scan" data-scan="bio">生物扫描</button></div><div class="scan-out" id="scanOut">等待扫描。</div><div class="decision"><button class="approve" id="approve">✓ 放行入港</button><button class="hold" id="hold">⛔ 暂扣检查</button></div></section><aside class="panel"><h2>今日协议</h2><div class="rules" id="rules"></div><hr style="border:0;border-top:1px solid #29445b;margin:14px 0"><p style="color:#8caec1;font-size:12px;line-height:1.7">每艘船都有一处关键事实。<br>先看扫描结果，再作决定。错误 3 次后结束执勤。</p></aside></main><div class="log" id="log">等待第一艘飞船靠港。</div><div class="panel-ui"><span id="progress">INSPECTED 0/8</span><button id="nextShip">呼叫下一艘</button></div><div class="rotate">横屏审查资料更清晰 ⟳</div><div id="title" class="overlay"><div class="box"><h1>星港检疫</h1><p>在未来星港担任边境检疫官。<br>检查证件、货舱与生物扫描，守住城市的安全协议。</p><button class="start" id="start">开始执勤</button><p>逐项查看船只资料，再决定放行或暂扣。<br>这是判断力游戏，不是反应力游戏。</p></div></div><div id="over" class="overlay hidden"><div class="box"><h1 id="overTitle">执勤结束</h1><p id="result"></p><button class="start" id="again">再次执勤</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const $=id=>document.getElementById(id);let active=false,day=1,score=0,errors=0,seen=0,current=null,scan='doc',best=Number(localStorage.starportCustomsBest||0);
const protocols=[{title:'A区安检',text:'来自<strong>暮光区</strong>的飞船必须持有<strong>银色通行证</strong>。'} ,{title:'冷链协议',text:'声明为<strong>冷冻货物</strong>时，货舱扫描必须显示<strong>温控稳定</strong>。'}, {title:'生物协议',text:'生物舱出现<strong>未知生命信号</strong>时，必须<strong>暂扣</strong>。'}];
const ships=[
{id:'NX-041',type:'民用货运',captain:'林岚',origin:'曙光区',pass:'蓝色',cargo:'量子晶体',valid:true,doc:'证件签名匹配，通行证有效。',cargoScan:'货舱无异常，量子晶体读数稳定。',bio:'生物扫描为空。'},
{id:'QZ-119',type:'冷链运输',captain:'阿岚',origin:'暮光区',pass:'银色',cargo:'冷冻货物',valid:true,doc:'暮光区银色通行证，签名匹配。',cargoScan:'温控稳定，冷冻货物封存完整。',bio:'生物扫描为空。'},
{id:'VX-772',type:'私人飞船',captain:'周野',origin:'暮光区',pass:'蓝色',cargo:'星尘燃料',valid:false,doc:'协议冲突：暮光区缺少银色通行证。',cargoScan:'燃料舱密封正常。',bio:'生物扫描为空。'},
{id:'ST-208',type:'科研飞船',captain:'苏弦',origin:'云环区',pass:'蓝色',cargo:'冷冻货物',valid:false,doc:'证件签名匹配。',cargoScan:'协议冲突：冷冻舱温控异常。',bio:'生物扫描为空。'},
{id:'LM-355',type:'医疗飞船',captain:'宁夏',origin:'曙光区',pass:'蓝色',cargo:'医疗样本',valid:false,doc:'证件签名匹配。',cargoScan:'货舱封条完整。',bio:'协议冲突：未知生命信号。'},
{id:'AR-660',type:'民用货运',captain:'白川',origin:'云环区',pass:'蓝色',cargo:'光能电池',valid:true,doc:'证件、签名与航线一致。',cargoScan:'电池舱无异常。',bio:'生物扫描为空。'},
{id:'KT-504',type:'冷链运输',captain:'高桥',origin:'暮光区',pass:'银色',cargo:'冷冻货物',valid:true,doc:'银色通行证与船籍一致。',cargoScan:'温控稳定，封条完整。',bio:'生物扫描为空。'},
{id:'ZE-901',type:'私人飞船',captain:'未知',origin:'深空外',pass:'无记录',cargo:'未申报',valid:false,doc:'协议冲突：船籍与证件均无记录。',cargoScan:'未申报货舱，建议暂扣。',bio:'生物扫描为空。'}];
function hud(){ $('day').textContent='DAY '+String(day).padStart(2,'0');$('score').textContent='SCORE '+String(score).padStart(4,'0');$('errors').textContent='ERROR '+errors+'/3';$('progress').textContent='INSPECTED '+seen+'/8'}
function setScan(k){scan=k;document.querySelectorAll('.scan').forEach(b=>b.classList.toggle('active',b.dataset.scan===k));const map={doc:'doc',cargo:'cargoScan',bio:'bio'};$('scanOut').textContent=current?current[map[k]]:'等待扫描。'}
function loadShip(){if(seen>=8){finish();return}current=ships[seen];scan='doc';$('shipId').textContent=current.id;$('shipType').textContent=current.type;$('captain').textContent=current.captain;$('origin').textContent=current.origin;$('pass').textContent=current.pass;$('cargo').textContent=current.cargo;setScan('doc');const p=protocols[(seen+day-1)%protocols.length];$('rules').innerHTML='<strong>'+p.title+'</strong><br>'+p.text;$('nextShip').textContent='资料已读 · 选择决定';log('新飞船入港：先完成三项扫描。');hud()}
function judge(approve){if(!active||!current)return;const correct=approve===current.valid;seen++;if(correct){score+=100;log('判断正确：协议通过。+'+100+' credits');}else{errors++;score=Math.max(0,score-60);log('判断错误：协议不符。-'+60+' credits');}day++;if(score>best){best=score;localStorage.starportCustomsBest=best}hud();if(errors>=3){finish();return}current=null;$('shipId').textContent='—';$('scanOut').textContent=correct?'等待下一艘飞船。':'重新校准协议。';if(seen>=8){finish();return}$('nextShip').textContent='呼叫下一艘';}
function finish(){active=false;best=Math.max(best,score);localStorage.starportCustomsBest=best;$('overTitle').textContent=errors>=3?'检疫线失守':'执勤完成';$('result').textContent='检查 '+seen+' 艘飞船 · 得分 '+score+' · 错误 '+errors+' · 最高 '+best;$('over').classList.remove('hidden')}
function reset(){active=true;day=1;score=0;errors=0;seen=0;current=null;$('title').classList.add('hidden');$('over').classList.add('hidden');loadShip()}
function tap(el,fn){el.addEventListener('pointerup',fn);el.addEventListener('click',fn)}tap($('start'),reset);tap($('again'),reset);tap($('approve'),()=>judge(true));tap($('hold'),()=>judge(false));tap($('nextShip'),()=>{if(active&&current)log('请先决定放行或暂扣。')});tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');document.querySelectorAll('.scan').forEach(b=>tap(b,()=>setScan(b.dataset.scan)));hud();
</script></body></html>
