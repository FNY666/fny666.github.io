<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>霓虹战机</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050811;color:#effaff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#060b1c}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,740px);display:flex;justify-content:space-between;font:800 13px monospace;color:#b6faff;text-shadow:0 0 8px #1fe0ff}.back{position:fixed;right:12px;top:10px;z-index:6;border:1px solid #66ecff;border-radius:999px;background:#0d4d6a;color:#fff;padding:8px 12px;font-weight:800}.controls{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:6;display:flex;gap:12px}.control{width:74px;height:47px;border:1px solid #66ecff;border-radius:14px;background:#0c2b42;color:#eaffff;font-weight:900;touch-action:none;user-select:none}.control:active,.control.on{background:#176f87}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:11px;left:10px;z-index:8;padding:7px 11px;border:1px solid #66ecff;border-radius:999px;background:#0b2934ee;color:#dffcff;font:11px monospace}}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,440px);padding:30px;border:1px solid #66ecff;border-radius:21px;background:linear-gradient(145deg,#0d2b44,#070b18);box-shadow:0 0 45px #1fb9ff55}.box h1{margin:0;color:#7defff;font-size:clamp(40px,11vw,74px);text-shadow:0 0 18px #24c8ff}.box p{color:#abc8de;line-height:1.8}.start{padding:13px 30px;border:1px solid #ffe15e;border-radius:999px;background:#6b5113;color:#fff4b6;font-weight:900;font-size:16px}.hidden{display:none!important}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="score">SCORE 00000</span><span id="hp">HP 100%</span><span id="wave">WAVE 01</span><span id="best">BEST 00000</span></div><button class="back" id="back">返回星港</button><div class="controls"><button class="control" data-k="left">◀</button><button class="control" data-k="fire">发射</button><button class="control" data-k="right">▶</button></div><div id="title" class="panel"><div class="box"><h1>霓虹战机</h1><p>NEON FIGHTER<br>穿越霓虹星域，击退一切来袭。</p><button class="start" id="start">出击</button><p>← → 移动 · 空格 / 发射键开火<br>击落敌机，保护星港核心</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>任务失败</h1><p id="result"></p><button class="start" id="again">重新出击</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=720,H=405,$=id=>document.getElementById(id);let active=false,last=0,score=0,hp=100,maxHp=100,wave=1,best=Number(localStorage.neonFighterBest||0),ship,bullets=[],enemies=[],sparks=[],items=[],fireCd=0,keys={left:false,right:false,fire:false};
function reset(){active=true;last=performance.now();score=0;hp=100;wave=1;fireCd=0;bullets=[];enemies=[];sparks=[];items=[];ship={x:W/2,y:H-60,w:28,h:24};$('title').classList.add('hidden');$('over').classList.add('hidden');hud()}
function hud(){$('score').textContent='SCORE '+String(Math.floor(score)).padStart(5,'0');$('hp').textContent='HP '+Math.round(hp/maxHp*100)+'%';$('wave').textContent='WAVE '+String(wave).padStart(2,'0');$('best').textContent='BEST '+String(Math.floor(best)).padStart(5,'0')}
function spark(x,y,c){for(let i=0;i<6;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,t:0,life:.3,c})}
let particles=[];
function spawnEnemy(){const x=80+Math.random()*(W-160);enemies.push({x,y:-20,w:22,h:20,vx:Math.sin(wave)*40+rand(-20,20),vy:55+wave*4,hp:1+Math.floor(wave/3)})}
function update(dt){if(!active)return;if(fireCd>0)fireCd-=dt;if(fireCd<=0&&keys.fire){bullets.push({x:ship.x,y:ship.y-14,vx:0,vy:-520});fireCd=.14}for(const b of bullets)b.y+=b.vy*dt;bullets=bullets.filter(b=>b.y>-20);if(Math.random()<.018+wave*.004)spawnEnemy();for(const e of enemies){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx+=rand(-8,8)*dt;if(e.x<20)e.vx=Math.abs(e.vx);if(e.x>W-20)e.vx=-Math.abs(e.vx);e.vy+=12*dt;for(const b of bullets){if(Math.hypot(e.x-b.x,e.y-b.y)<e.w+5){e.hp--;score+=30;spark(e.x,e.y,'#ffe45e')}}if(e.y>H+20)hp-=8;if(e.hp<=0){spark(e.x,e.y,'#ff5bc8');score+=50}if(hp<=0)finish()}enemies=enemies.filter(e=>e.hp>0&&e.y<H+30);bullets=bullets.filter(b=>b.y>-30);if(score>best){best=score;localStorage.neonFighterBest=best}hud()}
function finish(){active=false;$('result').textContent='得分 '+Math.floor(score)+' · 波次 '+wave+' · 最高 '+Math.floor(best);$('over').classList.remove('hidden')}
function draw(){ctx.fillStyle='#060b1c';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1d3c');g.addColorStop(1,'#060a16');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<80;i++){ctx.fillStyle=i%9?'#3a5790':'#eafaff';ctx.fillRect((i*97)%W,(i*47)%H,i%9?1:2,i%9?1:2)}ctx.fillStyle='#7defff';ctx.shadowBlur=12;ctx.shadowColor='#2cddff';ctx.fillRect(ship.x-14,ship.y-12,28,24);ctx.fillStyle='#ff5cc8';ctx.fillRect(ship.x-5,ship.y-18,10,6);ctx.shadowBlur=0;ctx.fillStyle='#ffe45e';ctx.fillRect(ship.x-3,ship.y+12,6,8);for(const b of bullets){ctx.fillStyle='#ffe45e';ctx.fillRect(b.x-2,b.y-6,4,12)}for(const e of enemies){ctx.fillStyle='#ff5bc8';ctx.shadowBlur=10;ctx.shadowColor='#ff5bc8';ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);ctx.fillStyle='#ffe45e';ctx.fillRect(e.x-4,e.y-4,8,8);ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}ctx.fillStyle='#b6faff';ctx.font='bold 12px monospace';ctx.fillText('WAVE '+wave+' · ENEMIES '+enemies.length,16,H-14)}
function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();particles=particles.filter(p=>p.t<.3);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '||k==='f')keys.fire=true});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' '||k==='f')keys.fire=false});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='left')keys.left=true;if(k==='right')keys.right=true;if(k==='fire')keys.fire=true});b.addEventListener('pointerup',()=>{if(k==='left')keys.left=false;if(k==='right')keys.right=false;if(k==='fire')keys.fire=false});b.addEventListener('pointercancel',()=>{if(k==='left')keys.left=false;if(k==='right')keys.right=false;if(k==='fire')keys.fire=false})});function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');requestAnimationFrame(loop);draw();
</script></body></html>
