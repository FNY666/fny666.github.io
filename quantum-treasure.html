<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>量子探宝</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0a0d14;color:#a8d4ff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#010408}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,740px);display:flex;justify-content:space-between;font:800 13px monospace;color:#4aa8ff;text-shadow:0 0 8px #2de0ff}.back{position:fixed;right:12px;top:10px;z-index:6;border:1px solid #3defff;border-radius:999px;background:#0b3d5a;color:#fff;padding:8px 12px;font-weight:800}.controls{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:6;display:flex;gap:12px}.control{width:74px;height:47px;border:1px solid #3defff;border-radius:14px;background:#0f2f45;color:#e0ffff;font-weight:900;touch-action:none;user-select:none}.control:active,.control.on{background:#176d87}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:11px;left:10px;z-index:8;padding:7px 11px;border:1px solid #3defff;border-radius:999px;background:#0b2934ee;color:#dffcff;font:11px monospace}}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,440px);padding:30px;border:1px solid #3defff;border-radius:21px;background:linear-gradient(145deg,#0d2b44,#070b18);box-shadow:0 0 45px #1fb9ff55}.box h1{margin:0;color:#7fffd4;font-size:clamp(38px,10vw,68px);text-shadow:0 0 16px #2cffef}.box p{color:#a8c8d8;line-height:1.7}.start{padding:12px 24px;border:1px solid #ffe15e;border-radius:999px;background:#6b5113;color:#fff4b6;font-weight:900;font-size:15px}.hidden{display:none!important}.tip{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:4;color:#7fb3c8;font:11px monospace;white-space:nowrap}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="score">SCORE 00000</span><span id="treasures">宝物 0/8</span><span id="time">TIME 00:00</span><span id="best">BEST 00000</span></div><button class="back" id="back">返回星港</button><div class="tip">使用 ← → 移动探险者 · 按空格键扫描量子宝物 · 收集所有宝物完成探索</div><div class="controls"><button class="control" data-k="left">◀</button><button class="control" data-k="space">扫描</button><button class="control" data-k="right">▶</button></div><div id="title" class="panel"><div class="box"><h1>量子探宝</h1><p>QUANTUM TREASURE<br>在量子迷宫中寻找失落的量子宝物，揭开宇宙奥秘。</p><button class="start" id="start">开始探宝</button><p>移动探险者，扫描量子宝物<br>收集8个量子宝物完成探索任务<br>躲避量子陷阱，保持量子场稳定</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>探索结束</h1><p id="result"></p><button class="start" id="again">再探索一次</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=720,H=405,$=id=>document.getElementById(id);let active=false,last=0,score=0,treasures=0,maxTreasures=8,time=0,best=Number(localStorage.quantumTreasureBest||0),explorer=null,treasureList=[],traps=[],particles=[];function reset(){active=true;last=performance.now();score=0;treasures=0;time=0;explorer={x:360,y:340,r:16};treasureList=[];traps=[];particles=[];for(let i=0;i<8;i++){treasureList.push({x:100+Math.random()*520,y:60+Math.random()*220,r:12,collected:false})}for(let i=0;i<4;i++){traps.push({x:100+Math.random()*520,y:60+Math.random()*220,r:20,active:true})}$('title').classList.add('hidden');$('over').classList.add('hidden');hud();}
function hud(){$('score').textContent='SCORE '+String(Math.floor(score)).padStart(5,'0');$('treasures').textContent='宝物 '+treasures+'/'+maxTreasures;$('time').textContent='TIME '+String(Math.floor(time/1000)).padStart(2,'0')+':'+String(Math.floor((time%1000)/10)).padStart(2,'0');$('best').textContent='BEST '+String(Math.floor(best)).padStart(5,'0');}
function finish(){active=false;best=Math.max(best,score);localStorage.quantumTreasureBest=best;$('result').textContent='得分 '+Math.floor(score)+' · 宝物 '+treasures+' · 最高 '+Math.floor(best);$('over').classList.remove('hidden');}
function update(dt){if(!active)return;time+=dt;for(const t of treasureList){if(!t.collected){const dx=explorer.x-t.x,dy=explorer.y-t.y;if(Math.hypot(dx,dy)<explorer.r+t.r+5){t.collected=true;treasures++;score+=500;particles.push({x:t.x,y:t.y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,t:0,life:.4,c:'#ff9'});if(treasures>=maxTreasures)finish()}}}for(const tr of traps){const dx=explorer.x-tr.x,dy=explorer.y-tr.y;if(Math.hypot(dx,dy)<explorer.r+tr.r){score=Math.max(0,score-200);particles.push({x:explorer.x,y:explorer.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,t:0,life:.3,c:'#f66'});}}for(const p of particles){p.t+=dt;}
function draw(){ctx.fillStyle='#010408';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(100,200,255,.12)';ctx.lineWidth=1;for(let x=80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=60;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const t of treasureList){if(!t.collected){ctx.fillStyle='#ff9';ctx.shadowBlur=15;ctx.shadowColor='#ff9';ctx.beginPath();ctx.arc(t.x,t.y,12,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('★',t.x,t.y+4);ctx.textAlign='left'}}for(const tr of traps){ctx.fillStyle='#f66';ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(tr.x,tr.y,20,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('⚠',tr.x,tr.y+4);ctx.textAlign='left'}ctx.fillStyle='#7defff';ctx.fillRect(explorer.x-8,explorer.y-8,16,16);for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}}
function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;if(active)update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')explorer.x=Math.max(20,explorer.x-40);if(k==='arrowright'||k==='d')explorer.x=Math.min(W-20,explorer.x+40);if(k===' ')for(const t of treasureList)if(!t.collected&&Math.hypot(explorer.x-t.x,explorer.y-t.y)<80){t.collected=true;treasures++;score+=500;particles.push({x:t.x,y:t.y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,t:0,life:.4,c:'#ff9'});if(treasures>=maxTreasures)finish();break;});
document.querySelectorAll('.control').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='left')explorer.x=Math.max(20,explorer.x-40);if(k==='right')explorer.x=Math.min(W-20,explorer.x+40);if(k==='space')for(const t of treasureList)if(!t.collected&&Math.hypot(explorer.x-t.x,explorer.y-t.y)<80){t.collected=true;treasures++;score+=500;particles.push({x:t.x,y:t.y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,t:0,life:.4,c:'#ff9'});if(treasures>=maxTreasures)finish();break;});});function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}
tap($('start'),reset);
tap($('again'),reset);
tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');
tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');
requestAnimationFrame(loop);draw();
</script></body></html>
