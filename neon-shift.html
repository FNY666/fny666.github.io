<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>霓虹跃迁</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050811;color:#dff6ff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#071020}.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:2;width:min(92vw,620px);display:flex;justify-content:space-between;font:700 14px monospace;color:#8ff3ff;text-shadow:0 0 8px #24d9ff}.panel{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:rgba(4,8,18,.82);text-align:center}.box{padding:28px 34px;border:1px solid #3b8caa;border-radius:18px;background:linear-gradient(150deg,rgba(11,28,52,.96),rgba(5,10,22,.96));box-shadow:0 0 36px #1684aa33}.box h1{font-size:clamp(38px,10vw,70px);margin:0;color:#7ff8ff;text-shadow:0 0 14px #12dfff}.box p{color:#a8bdd7;line-height:1.8}.btn{display:block;margin:10px auto;padding:13px 28px;border:1px solid #7ff8ff;border-radius:999px;background:#0c5268;color:#fff;font-weight:800;font-size:16px}.hidden{display:none!important}.touch{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:12px}.touch div{width:64px;height:48px;border:1px solid #58eaff99;border-radius:14px;display:grid;place-items:center;background:#0b2438bb;color:#bdf8ff;font-weight:800;touch-action:none;user-select:none}.touch div:active{background:#167995}.back{position:fixed;right:14px;top:12px;z-index:5;color:#bdf8ff;background:#0b2438cc;border:1px solid #58eaff99;border-radius:999px;padding:8px 12px}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:6;color:#fff;background:#10253dcc;border:1px solid #58eaff;border-radius:999px;padding:8px 14px}}
</style></head><body><div id="app"><canvas id="game" width="800" height="450"></canvas><div class="hud"><span id="score">SCORE 000000</span><span id="wave">WAVE 01</span><span id="best">BEST 000000</span></div><button class="back" id="back">返回星港</button><div class="touch"><div data-k="left">←</div><div data-k="jump">跃迁</div><div data-k="right">→</div></div><div class="rotate">横屏体验更佳 ⟳</div><div id="title" class="panel"><div class="box"><h1>霓虹跃迁</h1><p>NEON SHIFT<br>星港高速穿越协议</p><button class="btn" id="start">开始跃迁</button><p>← → 移动　空格 / 跃迁键跳跃<br>收集能量核心，躲开数据障碍</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>信号中断</h1><p id="result"></p><button class="btn" id="again">重新跃迁</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=800,H=450,G=365;let run=false,t=0,last=0,score=0,wave=1,best=+localStorage.neonShiftBest||0,keys={left:false,right:false,jump:false},player,items;
const $=id=>document.getElementById(id);function reset(){player={x:130,y:G-54,vy:0,w:28,h:54,on:true};items=[];score=0;wave=1;t=0;run=true;$('title').classList.add('hidden');$('over').classList.add('hidden');updateHud()}
function jump(){if(player.on){player.vy=-520;player.on=false}}
function updateHud(){$('score').textContent='SCORE '+String(score).padStart(6,'0');$('wave').textContent='WAVE '+String(wave).padStart(2,'0');$('best').textContent='BEST '+String(best).padStart(6,'0')}
function spawn(){const type=Math.random()<.7?'block':'core';items.push({x:830,y:type==='core'?G-100:G-35,w:type==='core'?18:34,h:type==='core'?18:35,type,got:false})}
function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;if(run){t+=dt;if(t>Math.max(.38,1.05-wave*.025)){spawn();t=0}wave=1+Math.floor(score/500);player.x+=((keys.right?1:0)-(keys.left?1:0))*230*dt;player.x=Math.max(40,Math.min(760,player.x));player.vy+=1250*dt;player.y+=player.vy*dt;if(player.y>=G-54){player.y=G-54;player.vy=0;player.on=true}for(const q of items){q.x-=300*dt*(1+wave*.035);if(q.type==='core'&&!q.got&&Math.abs(q.x-player.x)<34&&Math.abs(q.y-(player.y+25))<45){q.got=true;score+=100}if(q.type==='block'&&q.x<player.x+player.w&&q.x+q.w>player.x&&q.y<player.y+player.h&&q.y+q.h>player.y){end()}}items=items.filter(q=>q.x>-60&&!q.got);score+=Math.floor(dt*10);if(score>best){best=score;localStorage.neonShiftBest=best}updateHud()}draw();requestAnimationFrame(frame)}
function draw(){x.fillStyle='#071020';x.fillRect(0,0,W,H);let grd=x.createLinearGradient(0,0,0,G);grd.addColorStop(0,'#081735');grd.addColorStop(1,'#13213d');x.fillStyle=grd;x.fillRect(0,0,W,G);x.strokeStyle='#164d75';x.lineWidth=2;for(let i=0;i<14;i++){x.beginPath();x.moveTo(0,G-i*23);x.lineTo(W,G-i*23);x.stroke()}for(let i=0;i<9;i++){x.beginPath();x.moveTo(400,G);x.lineTo(80+i*90,450);x.stroke()}x.fillStyle='#102f40';x.fillRect(0,G,W,H-G);x.fillStyle='#62efff';x.fillRect(0,G,W,3);x.fillStyle='#7ff8ff';x.fillRect(player.x,player.y,player.w,player.h);x.fillStyle='#ff5bc8';x.fillRect(player.x+5,player.y+10,18,7);x.fillStyle='#0b1a2b';x.fillRect(player.x+9,player.y+27,10,19);for(const q of items){if(q.type==='core'){x.fillStyle='#ffe45e';x.shadowBlur=18;x.shadowColor='#ffe45e';x.beginPath();x.arc(q.x,q.y,10,0,7);x.fill();x.shadowBlur=0}else{x.fillStyle='#ff4d8d';x.fillRect(q.x,q.y,q.w,q.h);x.fillStyle='#ffb6df';x.fillRect(q.x+6,q.y+6,5,5)}}}
function end(){run=false;$('result').textContent='得分 '+score+' · 波次 '+wave+' · 最高 '+best;$('over').classList.remove('hidden')}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key===' '||e.key.toLowerCase()==='w')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});document.querySelectorAll('.touch div').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='jump')jump();else keys[k]=true});b.addEventListener('pointerup',()=>{if(k!=='jump')keys[k]=false});b.addEventListener('pointercancel',()=>{if(k!=='jump')keys[k]=false})});$('start').onclick=reset;$('again').onclick=reset;$('back').onclick=$('hall').onclick=()=>location.href='https://fny666.github.io/arcade.html';reset();run=false;requestAnimationFrame(frame);draw();
</script></body></html>
