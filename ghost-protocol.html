<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>幽影协议</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070f;color:#eaffff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}body{overflow:auto}#app{min-height:100vh;padding:14px 12px 26px;background:radial-gradient(circle at 50% 0,#1b1739,#070914 45%,#03050b)}.top{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:start;gap:10px}.logo{font-weight:900;color:#9dffcf;font-size:clamp(32px,8vw,62px);letter-spacing:.12em;text-shadow:0 0 15px #36ffbd}.sub{font:11px monospace;letter-spacing:.18em;color:#9db9dc;margin-top:4px}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{padding:8px 9px;border:1px solid #456a7a;border-radius:10px;background:#0c1826;color:#afffea;font:800 11px monospace}.back{border:1px solid #63f7c4;border-radius:999px;background:#0c4e48;color:#fff;padding:9px 12px;font-weight:800}.stage{max-width:760px;margin:20px auto 0;display:grid;grid-template-columns:minmax(300px,1fr) 200px;gap:14px}.board{position:relative;border:1px solid #31576b;border-radius:18px;background:#07121f;box-shadow:0 0 30px #20d5a522;padding:10px}.board canvas{width:100%;display:block;image-rendering:pixelated;border-radius:10px}.side{border:1px solid #31576b;border-radius:18px;background:#0a1424;padding:14px;min-height:300px}.side h2{font-size:17px;margin:0 0 10px;color:#9dffcf}.side p{font-size:12px;line-height:1.7;color:#9fb9ce}.objective{border-left:3px solid #ffe45e;padding:8px 9px;background:#172033;color:#e7efff;font:12px monospace;line-height:1.6}.feed{margin-top:12px;color:#83c9bd;font:11px monospace;min-height:48px}.controls{max-width:760px;margin:13px auto 0;display:grid;grid-template-columns:repeat(3,68px);gap:7px;justify-content:center}.control{height:44px;border:1px solid #62eec2;border-radius:12px;background:#0b2934;color:#eaffff;font-weight:900;touch-action:none;user-select:none}.control:active{background:#147c69}.empty{visibility:hidden}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,430px);padding:30px;border:1px solid #63f7c4;border-radius:20px;background:linear-gradient(145deg,#102d37,#070b18);box-shadow:0 0 44px #22d9a955}.box h1{font-size:clamp(40px,11vw,74px);margin:0;color:#9dffcf;text-shadow:0 0 17px #36ffbd}.box p{color:#a5c2d5;line-height:1.8}.btn{padding:13px 30px;border:1px solid #63f7c4;border-radius:999px;background:#0d5d51;color:#fff;font-weight:900;font-size:16px}.hidden{display:none!important}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:10px;right:10px;z-index:7;padding:7px 10px;border:1px solid #63f7c4;border-radius:999px;background:#0b2934ee;font:11px monospace}}@media(max-width:620px){.stage{grid-template-columns:1fr}.side{min-height:0}.side p{margin:5px 0}.board{padding:5px}.logo{font-size:35px}.hud{max-width:180px}.controls{grid-template-columns:repeat(3,62px)}}
</style></head><body><div id="app"><div class="top"><div><div class="logo">幽影协议</div><div class="sub">GHOST PROTOCOL · STEALTH GRID</div></div><div class="hud"><span class="stat" id="sector">SECTOR 01</span><span class="stat" id="alarm">ALARM 0/3</span><span class="stat" id="score">DATA 0%</span></div></div><button class="back" id="back">返回星港</button><main class="stage"><section class="board"><canvas id="game" width="640" height="400"></canvas></section><aside class="side"><h2>任务简报</h2><div class="objective" id="objective">潜入数据核心<br>拿到数据后返回出口</div><p>蓝色：你<br>绿色：出口<br>金色：数据核心<br>红色视野：敌方侦测区<br>灰色方块：掩体</p><div class="feed" id="feed">等待行动。</div></aside></main><div class="controls"><button class="control empty"></button><button class="control" data-m="up">▲</button><button class="control empty"></button><button class="control" data-m="left">◀</button><button class="control" data-m="down">▼</button><button class="control" data-m="right">▶</button></div><div class="rotate">横屏潜入更清晰 ⟳</div><div id="title" class="panel"><div class="box"><h1>幽影协议</h1><p>GHOST PROTOCOL<br>潜入失控的未来设施，带着数据活着离开。</p><button class="btn" id="start">开始潜入</button><p>方向键 / WASD / 下方方向键移动<br>躲开敌方红色视野，先拿核心，再回绿色出口</p></div></div><div id="over" class="panel hidden"><div class="box"><h1 id="overTitle">任务结束</h1><p id="result"></p><button class="btn" id="again">重新潜入</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=640,H=400,C=10,R=6,T=54,OX=50,OY=38,$=id=>document.getElementById(id);const levels=[{walls:[[2,1],[2,2],[2,3],[5,0],[5,1],[5,2],[7,3],[7,4],[7,5],[4,4]],guards:[{x:4,y:1,dx:1,dy:0},{x:8,y:4,dx:0,dy:-1}],core:[8,0],exit:[0,5]},{walls:[[1,1],[1,2],[1,3],[3,2],[4,2],[5,2],[6,2],[8,1],[8,2],[8,3]],guards:[{x:3,y:0,dx:1,dy:0},{x:7,y:5,dx:-1,dy:0}],core:[9,5],exit:[0,0]},{walls:[[2,0],[2,1],[2,2],[4,3],[5,3],[6,3],[7,1],[7,2],[7,3],[4,5]],guards:[{x:1,y:4,dx:1,dy:0},{x:8,y:0,dx:0,dy:1},{x:5,y:1,dx:-1,dy:0}],core:[9,0],exit:[0,5]}];let active=false,level=0,turn=0,alarm=0,score=0,data=0,player={x:0,y:5},guards=[],walls=[],core=[],exit=[],hasCore=false,feed='等待行动。',blink=0;
function reset(){active=true;level=0;turn=0;alarm=0;score=0;data=0;loadLevel();$('title').classList.add('hidden');$('over').classList.add('hidden');hud();message('潜入开始。不要进入红色视野。')}
function loadLevel(){const l=levels[level];walls=l.walls.map(a=>a.join(','));guards=l.guards.map(g=>({...g}));core=[...l.core];exit=[...l.exit];player={x:level%2?0:0,y:level%2?0:5};hasCore=false;turn=0;updateObjective();draw()}
function hud(){$('sector').textContent='SECTOR '+String(level+1).padStart(2,'0');$('alarm').textContent='ALARM '+alarm+'/3';$('score').textContent='DATA '+data+'%'}function message(s){feed=s;$('feed').textContent=s}
function updateObjective(){$('objective').innerHTML=hasCore?'数据已取得<br>返回绿色出口':'潜入数据核心<br>拿到数据后返回出口'}function blocked(x,y){return x<0||y<0||x>=C||y>=R||walls.includes(x+','+y)}function sees(g){if(g.x===player.x&&Math.abs(g.y-player.y)<=3)return true;if(g.y===player.y&&Math.abs(g.x-player.x)<=3)return true;return false}
function move(dx,dy){if(!active)return;const nx=player.x+dx,ny=player.y+dy;if(blocked(nx,ny)){message('掩体挡住了路线。');return}player.x=nx;player.y=ny;turn++;blink=.18;if(!hasCore&&player.x===core[0]&&player.y===core[1]){hasCore=true;data=Math.min(100,data+34);score+=250;message('数据核心已下载。现在撤离。');updateObjective()}if(hasCore&&player.x===exit[0]&&player.y===exit[1]){score+=400;data=Math.min(100,data+33);if(level===levels.length-1){win()}else{level++;loadLevel();message('区域清除。进入下一扇安全门。')}}for(const g of guards){g.x+=g.dx;g.y+=g.dy;if(blocked(g.x,g.y)||g.x<0||g.y<0||g.x>=C||g.y>=R){g.x-=g.dx;g.y-=g.dy;g.dx*=-1;g.dy*=-1}}if(guards.some(sees)){alarm++;message('警戒！你进入了侦测区。');if(alarm>=3)lose('警报锁死','触发 3 次警报 · 数据 '+data+'%')}else if(turn%3===0)message('扫描脉冲通过。保持低调。');hud();draw()}
function win(){active=false;score+=600;best=Math.max(Number(localStorage.ghostProtocolBest||0),score);localStorage.ghostProtocolBest=best;$('overTitle').textContent='潜入成功';$('result').textContent='三座区域全部清除 · 得分 '+score+' · 最高 '+best;$('over').classList.remove('hidden')}
function lose(t,m){active=false;$('overTitle').textContent=t;$('result').textContent=m+' · 得分 '+score;$('over').classList.remove('hidden')}
function draw(){ctx.fillStyle='#050b16';ctx.fillRect(0,0,W,H);ctx.fillStyle='#09182a';ctx.fillRect(0,0,W,H);for(let y=0;y<R;y++)for(let x=0;x<C;x++){const px=OX+x*T,py=OY+y*T;ctx.fillStyle=(x+y)%2?'#0d2132':'#0b1c2d';ctx.fillRect(px,py,T-2,T-2);ctx.strokeStyle='rgba(120,220,210,.13)';ctx.strokeRect(px,py,T-2,T-2)}for(const w of walls){const [x,y]=w.split(',').map(Number);ctx.fillStyle='#333f4c';ctx.shadowBlur=8;ctx.shadowColor='#101820';ctx.fillRect(OX+x*T+7,OY+y*T+7,T-16,T-16);ctx.shadowBlur=0;ctx.fillStyle='#5f6d77';ctx.fillRect(OX+x*T+12,OY+y*T+12,T-26,4)}for(const g of guards){const gx=OX+g.x*T+T/2,gy=OY+g.y*T+T/2;ctx.fillStyle='rgba(255,64,105,.16)';ctx.beginPath();if(g.dx){ctx.moveTo(gx,gy);ctx.lineTo(gx+g.dx*190,gy-42);ctx.lineTo(gx+g.dx*190,gy+42)}else{ctx.moveTo(gx,gy);ctx.lineTo(gx-42,gy+g.dy*190);ctx.lineTo(gx+42,gy+g.dy*190)}ctx.closePath();ctx.fill();ctx.fillStyle='#ff547d';ctx.shadowBlur=14;ctx.shadowColor='#ff3c70';ctx.beginPath();ctx.arc(gx,gy,13,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(gx-3,gy-3,6,6)}if(!hasCore){const cx=OX+core[0]*T+T/2,cy=OY+core[1]*T+T/2;ctx.fillStyle='#ffe45e';ctx.shadowBlur=18;ctx.shadowColor='#ffe45e';ctx.beginPath();ctx.arc(cx,cy,14+Math.sin(turn*.5)*2,0,7);ctx.fill();ctx.shadowBlur=0}const ex=OX+exit[0]*T+T/2,ey=OY+exit[1]*T+T/2;ctx.strokeStyle='#67ffad';ctx.lineWidth=4;ctx.shadowBlur=14;ctx.shadowColor='#45ffac';ctx.beginPath();ctx.arc(ex,ey,18,0,7);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#67ffad';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('EXIT',ex,ey+4);const px=OX+player.x*T+T/2,py=OY+player.y*T+T/2;ctx.fillStyle=blink>0?'#fff':'#70f5ff';ctx.shadowBlur=18;ctx.shadowColor='#4ceeff';ctx.beginPath();ctx.arc(px,py,15,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#092038';ctx.fillRect(px-4,py-4,8,8);ctx.textAlign='left';ctx.fillStyle='#8eb8c8';ctx.font='11px monospace';ctx.fillText('TURN '+String(turn).padStart(2,'0')+' · '+feed,16,H-12);blink=Math.max(0,blink-.016)}
function loop(){draw();requestAnimationFrame(loop)}function tap(el,fn){el.addEventListener('pointerup',fn);el.addEventListener('click',fn)}tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};addEventListener('keydown',e=>{const m=map[e.key]||map[e.key.toLowerCase()];if(m){move(...m);e.preventDefault()}});document.querySelectorAll('[data-m]').forEach(b=>{const m=b.dataset.m;const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[m];b.addEventListener('pointerup',e=>{e.preventDefault();move(...d)});b.addEventListener('click',()=>move(...d))});loadLevel();loop();
</script></body></html>
