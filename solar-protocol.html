<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>恒星协议</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060711;color:#eefaff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}body{overflow:auto}#app{min-height:100vh;padding:18px 14px 28px;background:radial-gradient(circle at 50% 0,#20204a,#080a18 42%,#04050b)}.top{max-width:920px;margin:auto;display:flex;justify-content:space-between;align-items:start;gap:10px}.logo{font-weight:900;color:#ff84df;text-shadow:0 0 15px #ff20c4;font-size:clamp(28px,7vw,58px);letter-spacing:.1em}.sub{color:#9cb6ed;font:11px monospace;letter-spacing:.2em;margin-top:4px}.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font:800 12px monospace}.stat{padding:8px 10px;border:1px solid #44568c;border-radius:10px;background:#10162b;color:#aff8ff}.back{border:1px solid #6ceeff;background:#0d4965;color:#fff;border-radius:999px;padding:9px 13px;font-weight:800}.battle{max-width:920px;margin:24px auto 0;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px;align-items:stretch}.card,.enemy,.core{border:1px solid #32456f;border-radius:16px;background:linear-gradient(145deg,#111a37,#080c1c);box-shadow:0 12px 30px #0006}.enemy,.core{padding:18px;min-height:245px}.core{border-color:#ff68cf55}.enemy h2,.core h2{margin:0 0 8px;font-size:20px}.intent{padding:9px;border-radius:10px;background:#27172d;color:#ff93d9;font:800 12px monospace;margin:12px 0}.hp{height:12px;border-radius:9px;background:#291b3b;overflow:hidden;border:1px solid #76508e}.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4eab,#ffdc63);width:100%;transition:.2s}.shield{color:#85eaff;font:800 12px monospace;margin-top:10px}.core{text-align:center;display:grid;place-items:center}.core .orb{width:116px;height:116px;border-radius:50%;border:2px solid #ff70dc;background:radial-gradient(circle,#fff2fd 0 4%,#ff75dd 8% 24%,#6f2eaa 55%,transparent 57%),#190e35;box-shadow:0 0 32px #ff38ce99, inset 0 0 28px #73eaff66}.core .orb.hit{animation:pulse .25s ease}.core p{color:#b0bddd;font-size:12px;line-height:1.7}.hand{max-width:920px;margin:18px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{min-height:160px;padding:15px;text-align:left;cursor:pointer;transition:.12s;position:relative}.card:hover,.card:active{transform:translateY(-4px);border-color:#ff75d9;box-shadow:0 0 20px #ff3fbe44}.card .type{font:800 10px monospace;color:#88ecff;letter-spacing:.16em}.card h3{margin:14px 0 8px;font-size:19px;color:#fff}.card p{margin:0;color:#a9b9d4;font-size:12px;line-height:1.55}.cost{position:absolute;right:12px;top:12px;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;background:#ff5cc8;color:#220b28;font-weight:900}.log{max-width:920px;margin:14px auto 0;min-height:46px;padding:12px 14px;border-left:3px solid #55e9ff;background:#0c1629;color:#a9cfee;font:12px monospace}.turn{max-width:920px;margin:10px auto 0;display:flex;justify-content:space-between;align-items:center;color:#9fb8d9;font:12px monospace}.end{padding:9px 14px;border:1px solid #72ecff;border-radius:999px;background:#113f59;color:#eaffff;font-weight:800}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#050711dd;text-align:center}.box{width:min(90vw,450px);padding:30px;border:1px solid #ff72d8;border-radius:20px;background:linear-gradient(145deg,#1a153c,#080b1b);box-shadow:0 0 46px #ff35c855}.box h1{font-size:clamp(42px,11vw,74px);margin:0;color:#ff8cde;text-shadow:0 0 18px #ff28c9}.box p{color:#b4c5e5;line-height:1.8}.start{padding:13px 30px;border:1px solid #75efff;border-radius:999px;background:#0b506b;color:#fff;font-weight:900;font-size:16px}.hidden{display:none!important}@keyframes pulse{50%{transform:scale(1.12);filter:brightness(1.6)}}@media(max-width:620px){.battle{grid-template-columns:1fr 1.1fr 1fr;gap:7px}.enemy,.core{padding:10px;min-height:190px}.enemy h2,.core h2{font-size:15px}.core .orb{width:78px;height:78px}.hand{gap:6px}.card{min-height:145px;padding:10px}.card h3{font-size:15px;margin:11px 0 5px}.card p{font-size:10px}.hud{max-width:180px}}
</style></head><body><div id="app"><div class="top"><div><div class="logo">恒星协议</div><div class="sub">SOLAR PROTOCOL · TACTICAL DECK</div></div><div class="hud"><span class="stat" id="energy">ENERGY 3/3</span><span class="stat" id="sector">SECTOR 01</span><span class="stat" id="score">SCORE 0000</span></div></div><button class="back" id="back">返回星港</button><main><div class="battle"><section class="enemy"><h2 id="enemyName">虚空哨兵</h2><div class="intent" id="intent">意图：攻击 8</div><div class="hp"><i id="enemyHp"></i></div><div class="shield" id="enemyStatus">HP 42 / 42</div><p id="enemyDesc">它正在读取你的卡组。</p></section><section class="core"><div><div class="orb" id="orb"></div><h2>星核防线</h2><p>用有限能量决定先攻、护盾还是过载。<br>每回合打出卡牌后结束回合。</p></div></section><section class="enemy"><h2>你的舰体</h2><div class="hp"><i id="playerHp" style="background:linear-gradient(90deg,#52eaff,#81ff9e)"></i></div><div class="shield" id="playerStatus">HP 60 / 60 · SHIELD 0</div><p>护盾可抵挡本回合伤害。</p></section></div><div class="hand" id="hand"></div><div class="turn"><span id="log">等待协议启动。</span><button class="end" id="endTurn">结束回合</button></div></main><div id="title" class="panel"><div class="box"><h1>恒星协议</h1><p>在废弃星系中，用一副可变的战术卡组活下去。<br>每张卡都要消耗能源，每个回合都要承担风险。</p><button class="start" id="start">接入星核</button></div></div><div id="over" class="panel hidden"><div class="box"><h1 id="overTitle">协议终止</h1><p id="result"></p><button class="start" id="again">重新接入</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const $=id=>document.getElementById(id);let active=false,energy=3,sector=1,score=0,playerHp=60,playerMax=60,shield=0,enemyHp=42,enemyMax=42,turn=1,deck=[],hand=[],best=Number(localStorage.solarProtocolBest||0);const cards=[{id:'beam',type:'ATTACK',name:'光束切割',desc:'造成 9 点伤害。',cost:1},{id:'barrier',type:'DEFENSE',name:'相位护盾',desc:'获得 11 点护盾。',cost:1},{id:'pulse',type:'ATTACK',name:'脉冲爆破',desc:'造成 15 点伤害，但消耗 2 能量。',cost:2},{id:'repair',type:'SYSTEM',name:'纳米修复',desc:'恢复 8 点舰体。',cost:1},{id:'overload',type:'TACTICAL',name:'星核过载',desc:'造成 24 点伤害，消耗 3 能量。',cost:3}];
function log(s){$('log').textContent=s}function hud(){$('energy').textContent='ENERGY '+energy+'/3';$('sector').textContent='SECTOR '+String(sector).padStart(2,'0');$('score').textContent='SCORE '+String(score).padStart(4,'0');$('enemyHp').style.width=Math.max(0,enemyHp/enemyMax*100)+'%';$('playerHp').style.width=Math.max(0,playerHp/playerMax*100)+'%';$('enemyStatus').textContent='HP '+Math.max(0,enemyHp)+' / '+enemyMax+' · SHIELD 0';$('playerStatus').textContent='HP '+playerHp+' / '+playerMax+' · SHIELD '+shield}
function reset(){active=true;sector=1;score=0;playerHp=60;shield=0;turn=1;energy=3;enemyMax=42;enemyHp=enemyMax;hand=[];deck=[];$('title').classList.add('hidden');$('over').classList.add('hidden');drawHand();hud();log('协议已接入。选择你的第一张卡。')}
function drawHand(){hand=[];for(let i=0;i<4;i++)hand.push(cards[(i+sector+turn)%cards.length]);$('hand').innerHTML='';hand.forEach((c,i)=>{const el=document.createElement('button');el.className='card';el.innerHTML='<span class="type">'+c.type+'</span><span class="cost">'+c.cost+'</span><h3>'+c.name+'</h3><p>'+c.desc+'</p>';el.onclick=()=>play(i);$('hand').appendChild(el)})}
function play(i){if(!active)return;const c=hand[i];if(!c||energy<c.cost){log('能源不足：需要 '+(c?c.cost:0)+' 点。');return}energy-=c.cost;if(c.id==='beam'){enemyHp-=9;score+=90;log('光束切割命中：-9 HP。')}if(c.id==='pulse'){enemyHp-=15;score+=160;log('脉冲爆破命中：-15 HP。')}if(c.id==='overload'){enemyHp-=24;score+=280;log('星核过载：-24 HP。')}if(c.id==='barrier'){shield+=11;score+=20;log('相位护盾上线：+'+shield+' SHIELD。')}if(c.id==='repair'){playerHp=Math.min(playerMax,playerHp+8);score+=20;log('纳米修复完成：+8 HP。')}$('orb').classList.remove('hit');void $('orb').offsetWidth;$('orb').classList.add('hit');hand.splice(i,1);drawHand();hud();if(enemyHp<=0)winSector()}
function endTurn(){if(!active)return;const dmg=8+sector*2;const blocked=Math.min(shield,dmg);shield-=blocked;playerHp-=dmg-blocked;log('敌方回合：攻击 '+dmg+' · 护盾吸收 '+blocked+'。');if(playerHp<=0){playerHp=0;end('舰体失守','坚持到第 '+sector+' 区 · 得分 '+score);return}turn++;energy=3;drawHand();hud()}
function winSector(){score+=500;sector++;if(sector>5){end('协议完成','穿越 5 个星区 · 得分 '+score);return}enemyMax=42+sector*10;enemyHp=enemyMax;shield=0;energy=3;turn=1;drawHand();hud();log('星区清除！进入 Sector '+String(sector).padStart(2,'0')+'。')}
function end(title,msg){active=false;best=Math.max(best,score);localStorage.solarProtocolBest=best;$('overTitle').textContent=title;$('result').textContent=msg+' · 最高 '+best;$('over').classList.remove('hidden')}
function boot(){hud();drawHand();}tap($('start'),reset);tap($('again'),reset);tap($('endTurn'),endTurn);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}boot();
</script></body></html>
