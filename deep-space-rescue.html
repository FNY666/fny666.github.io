<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>深空救援</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#040711;color:#eaffff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}body{overflow:auto}#app{min-height:100vh;padding:15px 13px 25px;background:radial-gradient(circle at 50% 0,#182a4c,#070b18 48%,#03050c)}.top{max-width:930px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:start}.logo{font-weight:900;color:#ffe177;font-size:clamp(32px,8vw,62px);letter-spacing:.12em;text-shadow:0 0 16px #ffd23f}.sub{margin-top:4px;color:#a4bddc;font:11px monospace;letter-spacing:.2em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{padding:8px 10px;border:1px solid #576b8a;border-radius:10px;background:#0b162a;color:#b9f8ff;font:800 11px monospace}.back{position:fixed;right:12px;top:10px;z-index:7;padding:9px 12px;border:1px solid #ffe177;border-radius:999px;background:#4b3a0c;color:#fff;font-weight:800}.layout{max-width:930px;margin:20px auto 0;display:grid;grid-template-columns:1.18fr .82fr;gap:14px}.map,.brief{border:1px solid #415879;border-radius:18px;background:linear-gradient(145deg,#0d1d35,#070c19);box-shadow:0 12px 32px #0008}.map{padding:8px}.map canvas{width:100%;display:block;image-rendering:pixelated;border-radius:12px}.brief{padding:16px}.brief h2{margin:0 0 10px;color:#ffe177;font-size:19px}.brief p{font-size:12px;color:#abc2d8;line-height:1.75}.mission{border-left:3px solid #6deaff;background:#101e34;padding:9px 10px;color:#dffaff;font:12px monospace;line-height:1.7}.calls{max-width:930px;margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.call{position:relative;min-height:148px;padding:12px;border:1px solid #405675;border-radius:14px;background:#0c1729;cursor:pointer;transition:.12s}.call.selected{border-color:#ffe177;box-shadow:0 0 18px #ffcf4e44;transform:translateY(-3px)}.call.expired{opacity:.46}.call h3{margin:0 0 8px;color:#f3f8ff;font-size:14px}.call p{margin:4px 0;color:#9db7d0;font-size:11px;line-height:1.5}.call .timer{position:absolute;right:10px;top:10px;color:#ff7198;font:800 12px monospace}.call .send{position:absolute;bottom:10px;left:10px;right:10px;padding:7px;border:1px solid #6deaff;border-radius:999px;background:#0e3e58;color:#eaffff;font-weight:800;font-size:11px}.call .send:active{background:#176f87}.bottom{max-width:930px;margin:14px auto 0;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-left:3px solid #ffe177;background:#0b1729;color:#9fbad1;font:11px monospace}.bottom button{padding:8px 12px;border:1px solid #ffe177;border-radius:999px;background:#4b3a0c;color:#fff;font-weight:800}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,450px);padding:30px;border:1px solid #ffe177;border-radius:20px;background:linear-gradient(145deg,#2a2310,#070b18);box-shadow:0 0 46px #ffc53a55}.box h1{margin:0;color:#ffe177;font-size:clamp(40px,11vw,74px);text-shadow:0 0 17px #ffc53a}.box p{color:#b9c9df;line-height:1.8}.start{padding:13px 30px;border:1px solid #ffe177;border-radius:999px;background:#6b500b;color:#fff;font-weight:900;font-size:16px}.hidden{display:none!important}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:10px;right:10px;z-index:8;padding:7px 10px;border:1px solid #ffe177;border-radius:999px;background:#34270bee;font:11px monospace}}@media(max-width:700px){.layout{grid-template-columns:1fr;margin-top:16px}.brief{padding:12px}.calls{grid-template-columns:1fr 1fr}.call{min-height:140px}.hud{max-width:190px}.top{gap:7px}.bottom{font-size:10px}}
</style></head><body><div id="app"><div class="top"><div><div class="logo">深空救援</div><div class="sub">DEEP SPACE RESCUE · COMMAND DECK</div></div><div class="hud"><span class="stat" id="fuel">FUEL 100%</span><span class="stat" id="saved">SAVED 000</span><span class="stat" id="score">SCORE 0000</span></div></div><button class="back" id="back">返回星港</button><main class="layout"><section class="map"><canvas id="game" width="720" height="390"></canvas></section><aside class="brief"><h2>指挥简报</h2><div class="mission" id="mission">等待救援信号。<br>选择最紧急的呼叫并派遣救援艇。</div><p>每个信号都有不同倒计时、距离和燃料成本。<br>救援成功获得分数；信号过期会失去幸存者。<br>燃料不足时必须谨慎排序。</p><p style="color:#ffe177">目标：完成 8 次救援，或在燃料耗尽前尽可能多地救人。</p></aside></main><div class="calls" id="calls"></div><div class="bottom"><span id="log">控制台待命。</span><button id="scan">扫描新信号</button></div><div class="rotate">横屏指挥视野更佳 ⟳</div><div id="title" class="panel"><div class="box"><h1>深空救援</h1><p>DEEP SPACE RESCUE<br>在星云风暴中调度救援艇，争分夺秒拯救幸存者。</p><button class="start" id="start">接入指挥台</button><p>点击救援信号选择目标，再点击派遣。<br>有限燃料下，先救最紧急的目标。</p></div></div><div id="over" class="panel hidden"><div class="box"><h1 id="overTitle">任务结束</h1><p id="result"></p><button class="start" id="again">重新值班</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=720,H=390,$=id=>document.getElementById(id);let active=false,last=0,t=0,fuel=100,saved=0,score=0,best=Number(localStorage.deepSpaceRescueBest||0),calls=[],selected=-1,particles=[];
const nodes=[{x:75,y:290,n:'星港中枢',c:'#ffe177'},{x:250,y:100,n:'A-17残骸区',c:'#6deaff'},{x:460,y:72,n:'冷焰云',c:'#ff7198'},{x:630,y:180,n:'远日点',c:'#a78cff'},{x:430,y:290,n:'静默带',c:'#71ffb0'},{x:170,y:195,n:'折跃裂隙',c:'#f5a0ff'}];
function reset(){active=true;last=performance.now();t=0;fuel=100;saved=0;score=0;calls=[];selected=-1;particles=[];$('title').classList.add('hidden');$('over').classList.add('hidden');spawnCalls(3);hud();log('指挥台接入。选择救援信号。')}
function hud(){$('fuel').textContent='FUEL '+Math.max(0,Math.ceil(fuel))+'%';$('saved').textContent='SAVED '+String(saved).padStart(3,'0');$('score').textContent='SCORE '+String(Math.floor(score)).padStart(4,'0')}
function log(s){$('log').textContent=s}
function spawnCalls(n=1){for(let i=0;i<n;i++){const from=1+Math.floor(Math.random()*5),dist=Math.round(80+Math.random()*230),urg=25+Math.floor(Math.random()*35);calls.push({id:'SR-'+(100+Math.floor(Math.random()*899)),zone:nodes[from].n,from,distance:dist,remain:urg,people:1+Math.floor(Math.random()*6),cost:Math.ceil(dist/4),status:'waiting'});}renderCalls()}
function renderCalls(){const box=$('calls');box.innerHTML='';calls.forEach((q,i)=>{const el=document.createElement('div');el.className='call'+(i===selected?' selected':'')+(q.status==='expired'?' expired':'');el.innerHTML='<span class="timer">T-'+Math.max(0,Math.ceil(q.remain))+'s</span><h3>'+q.id+'</h3><p>'+q.zone+'</p><p>幸存者 '+q.people+' 人<br>距离 '+q.distance+' km · 燃料 '+q.cost+'%</p><button class="send">'+(q.status==='waiting'?'派遣救援':'已处理')+'</button>';el.onclick=()=>{if(q.status==='waiting'){selected=i;renderCalls();$('mission').innerHTML='<b>'+q.id+'</b><br>'+q.zone+' · '+q.people+' 人等待救援<br>预计消耗 '+q.cost+'% 燃料。'}};el.querySelector('.send').onclick=e=>{e.stopPropagation();dispatch(i)};box.appendChild(el)})}
function dispatch(i){const q=calls[i];if(!active||!q||q.status!=='waiting')return;if(fuel<q.cost){log('燃料不足，无法派遣 '+q.id);return}fuel-=q.cost;q.status='saved';saved+=q.people;score+=q.people*100+Math.max(0,Math.floor(q.remain))*5;best=Math.max(best,score);localStorage.deepSpaceRescueBest=best;burst(nodes[q.from].x,nodes[q.from].y,'#ffe177');log(q.id+' 救援成功：'+q.people+' 人已转移。');selected=-1;renderCalls();hud();if(saved>=25||score>=3000)finish('救援目标达成','拯救 '+saved+' 名幸存者 · 得分 '+score)}
function burst(x,y,c){for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,t:0,life:.45,c})}
function finish(title,msg){active=false;$('overTitle').textContent=title;$('result').textContent=msg+' · 最高 '+best;$('over').classList.remove('hidden')}
function tick(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(active){t+=dt;for(const q of calls)if(q.status==='waiting'){q.remain-=dt;if(q.remain<=0){q.remain=0;q.status='expired';log(q.id+' 信号丢失，救援失败。');selected=-1;renderCalls()}}if(t>7){t=0;spawnCalls(1)}if(fuel<=0&&!calls.some(q=>q.status==='waiting'))finish('燃料耗尽','已救 '+saved+' 人 · 得分 '+score);for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.t<p.life);hud()}draw();requestAnimationFrame(tick)}
function draw(){ctx.fillStyle='#050918';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(380,210,20,380,210,480);g.addColorStop(0,'#192c59');g.addColorStop(1,'#050817');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<75;i++){ctx.fillStyle=i%8?'#40558c':'#fff';ctx.fillRect((i*97)%W,(i*43)%H,i%8?1:2,i%8?1:2)}ctx.strokeStyle='rgba(108,220,255,.15)';ctx.lineWidth=2;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){if((i+j)%3===0){ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke()}}ctx.strokeStyle='#ffe177';ctx.lineWidth=3;ctx.beginPath();ctx.arc(nodes[0].x,nodes[0].y,31,0,7);ctx.stroke();for(const q of calls){if(q.status==='waiting'){const n=nodes[q.from];ctx.strokeStyle=q===calls[selected]?'#fff':'#ff7198';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(nodes[0].x,nodes[0].y);ctx.lineTo(n.x,n.y);ctx.stroke();ctx.setLineDash([])}}for(let i=0;i<nodes.length;i++){const n=nodes[i];ctx.fillStyle=n.c;ctx.shadowBlur=18;ctx.shadowColor=n.c;ctx.beginPath();ctx.arc(n.x,n.y,i===0?13:10,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#dffaff';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(n.n,n.x,n.y+27)}ctx.fillStyle='#ffe177';ctx.font='bold 11px monospace';ctx.textAlign='left';ctx.fillText('COMMAND LINK · ACTIVE',16,22);for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}}
function finish(title,msg){active=false;$('overTitle').textContent=title;$('result').textContent=msg+' · 最高 '+best;$('over').classList.remove('hidden')}
function tap(el,fn){el.addEventListener('pointerup',fn);el.addEventListener('click',fn)}tap($('start'),reset);tap($('again'),reset);tap($('scan'),()=>{if(active){spawnCalls(1);log('扫描完成：新增救援信号。')}});tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');draw();requestAnimationFrame(tick);
</script></body></html>
