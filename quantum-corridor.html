<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>量子回廊</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#040711;color:#e9fbff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#050a18}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,700px);display:flex;justify-content:space-between;font:800 13px monospace;color:#b4f8ff;text-shadow:0 0 8px #16dfff}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(3,6,16,.84);text-align:center}.box{width:min(88vw,430px);padding:28px 30px;border:1px solid #59e9ff;border-radius:20px;background:linear-gradient(145deg,rgba(10,27,56,.98),rgba(4,8,20,.98));box-shadow:0 0 44px #168fab44}.box h1{margin:0;font-size:clamp(42px,11vw,76px);color:#69f4ff;text-shadow:0 0 16px #14dfff}.box p{color:#a5bfdf;line-height:1.8}.btn,.back{font:inherit;font-weight:800;color:#eaffff;background:#0b4e6c;border:1px solid #69edff;border-radius:999px}.btn{display:block;margin:12px auto;padding:13px 30px;font-size:16px}.hidden{display:none!important}.back{position:fixed;right:12px;top:10px;z-index:6;padding:8px 13px;font-size:12px}.hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:3;color:#86b8d6;font:700 12px monospace;white-space:nowrap}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:7;padding:8px 14px;border:1px solid #69efff;border-radius:999px;background:#0b2139dd;font-size:12px}}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="level">SECTOR 01/06</span><span id="moves">MOVES 00</span><span id="best">BEST 00</span></div><button class="back" id="back">返回星港</button><div class="hint">点击节点旋转线路 · WASD/方向键移动选择 · 空格旋转</div><div class="rotate">横屏连接星门 ⟳</div><div id="title" class="panel"><div class="box"><h1>量子回廊</h1><p>QUANTUM CORRIDOR<br>连接失落星门，恢复星港航线</p><button class="btn" id="start">启动连接</button><p>点击能量节点顺时针旋转<br>让左侧星源抵达右侧核心</p></div></div><div id="win" class="panel hidden"><div class="box"><h1 id="winTitle">连接成功</h1><p id="winText"></p><button class="btn" id="next">下一扇星门</button><button class="btn" id="again">重新挑战</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=720,H=405,COLS=6,ROWS=4,TILE=62,OX=174,OY=100,N=1,E=2,S=4,WEST=8;
const $=id=>document.getElementById(id);let running=false,level=0,moves=0,best=Number(localStorage.quantumCorridorBest||0),tiles=[],cursor={x:0,y:1},pulse=0;
// 每个关卡是一条确定路径；turns 是初始旋转次数，保证可解但需思考
const LEVELS=[
 {path:[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],turns:[1,3,2,1,0,2]},
 {path:[[0,2],[0,1],[1,1],[2,1],[2,2],[2,3],[3,3],[4,3],[4,2],[5,2]],turns:[2,1,3,1,2,0,3,1,2,3]},
 {path:[[0,1],[1,1],[1,2],[1,3],[2,3],[3,3],[3,2],[3,1],[4,1],[4,2],[4,3],[5,3]],turns:[3,2,1,3,0,2,1,2,3,1,2,0]},
 {path:[[0,2],[1,2],[1,1],[2,1],[2,0],[3,0],[3,1],[4,1],[4,2],[3,2],[3,3],[4,3],[5,3],[5,2]],turns:[1,3,2,1,2,3,0,1,2,1,3,2,1,3]},
 {path:[[0,3],[1,3],[1,2],[2,2],[2,1],[3,1],[3,2],[4,2],[4,3],[5,3],[5,2],[4,2],[4,1],[5,1]],turns:[2,1,3,2,1,3,1,2,0,1,3,2,1,3]},
 {path:[[0,1],[1,1],[1,0],[2,0],[2,1],[2,2],[3,2],[3,3],[4,3],[4,2],[4,1],[5,1],[5,2],[5,3]],turns:[3,1,2,3,1,2,0,1,3,2,1,3,2,1]}
];
function key(x,y){return x+','+y}function baseMask(a,b){const dx=b[0]-a[0],dy=b[1]-a[1];return dx===1?E:dx===-1?WEST:dy===1?S:N}
function makeLevel(i){const L=LEVELS[i],want=new Map();for(let j=0;j<L.path.length-1;j++){const a=L.path[j],b=L.path[j+1],ma=baseMask(a,b),mb=baseMask(b,a);want.set(key(...a),(want.get(key(...a))||0)|ma);want.set(key(...b),(want.get(key(...b))||0)|mb)}tiles=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const k=key(x,y),mask=want.get(k)||((x+y*3)%3===0?N|S:E|WEST);const initial=L.turns[tiles.length%L.turns.length];tiles.push({x,y,mask,rot:initial})}cursor={x:0,y:L.path[0][1]};moves=0;hud()}
function rotateTile(t){t.rot=(t.rot+1)%4;moves++;hud();if(connected())setTimeout(win,220)}
function mask(t){let m=t.mask;for(let i=0;i<t.rot;i++)m=((m<<1)&15)|(m>>3);return m}
function tileAt(x,y){return tiles.find(t=>t.x===x&&t.y===y)}
function connected(){const start=tiles.find(t=>t.x===0&&t.y===LEVELS[level].path[0][1]);const target=tiles.find(t=>t.x===5&&t.y===LEVELS[level].path[LEVELS[level].path.length-1][1]);const seen=new Set(),q=[start];while(q.length){const t=q.shift(),k=key(t.x,t.y);if(seen.has(k))continue;seen.add(k);if(t===target)return true;const m=mask(t),ds=[[0,-1,N,S],[1,0,E,WEST],[0,1,S,N],[-1,0,WEST,E]];for(const [dx,dy,a,b] of ds){if(!(m&a))continue;const n=tileAt(t.x+dx,t.y+dy);if(n&&mask(n)&b)q.push(n)}}return false}
function hud(){$('level').textContent='SECTOR '+String(level+1).padStart(2,'0')+'/06';$('moves').textContent='MOVES '+String(moves).padStart(2,'0');$('best').textContent='BEST '+String(best).padStart(2,'0')}
function start(){running=true;level=0;makeLevel(0);$('title').classList.add('hidden');$('win').classList.add('hidden')}
function win(){if(!running)return;running=false;best=Math.min(best||999,moves);if(!best||moves<best){best=moves;localStorage.quantumCorridorBest=best}$('winTitle').textContent=level===LEVELS.length-1?'星港航线恢复':'连接成功';$('winText').textContent='第 '+String(level+1).padStart(2,'0')+' 扇星门已连接 · '+moves+' 步 · 最佳 '+best;if(level<LEVELS.length-1){$('next').classList.remove('hidden');$('next').textContent='下一扇星门'}else{$('next').classList.add('hidden')}}
function next(){if(level<LEVELS.length-1){level++;running=true;makeLevel(level);$('win').classList.add('hidden')}}
function reset(){start()}
function draw(){pulse+=.03;ctx.fillStyle='#050916';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07102b');g.addColorStop(1,'#100c2b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<80;i++){ctx.fillStyle=i%9===0?'#fff':'#536a9e';ctx.fillRect((i*97)%W,(i*43)%245, i%9===0?2:1,i%9===0?2:1)}ctx.strokeStyle='rgba(87,134,220,.15)';for(let y=45;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}const x0=OX,y0=OY;for(const t of tiles){const px=x0+t.x*TILE,py=y0+t.y*TILE,sel=t.x===cursor.x&&t.y===cursor.y;ctx.fillStyle=sel?'rgba(255,225,92,.18)':'rgba(14,32,63,.85)';ctx.strokeStyle=sel?'#ffe45e':'#246384';ctx.lineWidth=sel?3:1;ctx.fillRect(px,py,TILE-4,TILE-4);ctx.strokeRect(px+1,py+1,TILE-6,TILE-6);const m=mask(t),cx=px+(TILE-4)/2,cy=py+(TILE-4)/2;ctx.lineWidth=sel?8:6;ctx.strokeStyle=(m&(N|E|S|WEST))?'#63efff':'#193654';ctx.shadowBlur=sel?12:5;ctx.shadowColor='#34ddff';for(const [bit,dx,dy] of [[N,0,-1],[E,1,0],[S,0,1],[WEST,-1,0]])if(m&bit){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+dx*25,cy+dy*25);ctx.stroke()}ctx.shadowBlur=0;ctx.fillStyle='#e8fbff';ctx.beginPath();ctx.arc(cx,cy,7,0,7);ctx.fill();ctx.fillStyle='#12304e';ctx.beginPath();ctx.arc(cx,cy,3,0,7);ctx.fill()}
const sy=OY+LEVELS[level].path[0][1]*TILE+28,ty=OY+LEVELS[level].path[LEVELS[level].path.length-1][1]*TILE+28;ctx.fillStyle='#ffe45e';ctx.shadowBlur=18;ctx.shadowColor='#ffe45e';ctx.beginPath();ctx.arc(OX-25,sy,10+Math.sin(pulse)*2,0,7);ctx.fill();ctx.fillStyle='#ff7bd9';ctx.beginPath();ctx.arc(OX+COLS*TILE-27,ty,11+Math.sin(pulse+1)*2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font='800 10px monospace';ctx.fillStyle='#ffe45e';ctx.fillText('SOURCE',OX-50,sy-18);ctx.fillStyle='#ff7bd9';ctx.fillText('CORE',OX+COLS*TILE-42,ty-18);if(running&&!connected()){ctx.font='800 11px monospace';ctx.fillStyle='#7898bb';ctx.textAlign='center';ctx.fillText('ROUTE OFFLINE · ROTATE NODES TO RESTORE',W/2,365);ctx.textAlign='left'}}
function loop(){draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(!running)return;let nx=cursor.x,ny=cursor.y;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')nx--;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')nx++;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')ny--;if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')ny++;if(e.key===' '){rotateTile(tileAt(cursor.x,cursor.y));e.preventDefault();return}if(nx!==cursor.x||ny!==cursor.y){cursor.x=Math.max(0,Math.min(COLS-1,nx));cursor.y=Math.max(0,Math.min(ROWS-1,ny));e.preventDefault()}});canvas.addEventListener('pointerdown',e=>{if(!running)return;const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height,x=Math.floor((e.clientX-r.left)*sx-OX)/TILE,y=Math.floor((e.clientY-r.top)*sy-OY)/TILE;const tx=Math.floor(x),ty=Math.floor(y);if(tx>=0&&tx<COLS&&ty>=0&&ty<ROWS){cursor={x:tx,y:ty};rotateTile(tileAt(tx,ty))}});function tap(el,fn){el.addEventListener('pointerup',fn);el.addEventListener('click',fn)}tap($('start'),start);tap($('again'),reset);tap($('next'),next);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');makeLevel(0);loop();
</script></body></html>
