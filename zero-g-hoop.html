<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>零重力篮</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050811;color:#effaff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#060b1c}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,740px);display:flex;justify-content:space-between;font:800 13px monospace;color:#b6faff;text-shadow:0 0 8px #1fe0ff}.back{position:fixed;right:12px;top:10px;z-index:6;border:1px solid #66ecff;border-radius:999px;background:#0d4d6a;color:#fff;padding:8px 12px;font-weight:800}.controls{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:6;display:flex;gap:12px}.control{width:74px;height:47px;border:1px solid #66ecff;border-radius:14px;background:#0c2b42;color:#eaffff;font-weight:900;touch-action:none;user-select:none}.control:active,.control.on{background:#176f87}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:11px;left:10px;z-index:8;padding:7px 11px;border:1px solid #66ecff;border-radius:999px;background:#0b2934ee;color:#dffcff;font:11px monospace}}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,440px);padding:30px;border:1px solid #66ecff;border-radius:21px;background:linear-gradient(145deg,#0d2b44,#070b18);box-shadow:0 0 45px #1fb9ff55}.box h1{margin:0;color:#7defff;font-size:clamp(40px,11vw,74px);text-shadow:0 0 18px #24c8ff}.box p{color:#abc8de;line-height:1.8}.start{padding:13px 30px;border:1px solid #ffe15e;border-radius:999px;background:#6b5113;color:#fff4b6;font-weight:900;font-size:16px}.hidden{display:none!important}.tip{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:4;color:#8fb2c8;font:11px monospace;white-space:nowrap}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="score">SCORE 00000</span><span id="streak">STREAK 0</span><span id="time">TIME 30</span><span id="best">BEST 00000</span></div><button class="back" id="back">返回星港</button><div class="tip">点击屏幕或按空格 沿瞄准线发射 · 篮筐在左右漂浮 · 命中能量环加更多分</div><div class="controls"><button class="control" data-k="left">◀ 移动</button><button class="control" data-k="shoot">发射</button><button class="control" data-k="right">移动 ▶</button></div><div class="rotate">横屏投篮更准 ⟳</div><div id="title" class="panel"><div class="box"><h1>零重力篮</h1><p>ZERO-G HOOP<br>在失重的星港穹顶里投出完美一球。</p><button class="start" id="start">开始投篮</button><p>篮筐漂浮移动，瞄准线会随发射角度变化。<br>命中中心获得 10 分，连续命中会积累连击。</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>比赛结束</h1><p id="result"></p><button class="start" id="again">再投一局</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=720,H=405,$=id=>document.getElementById(id);let active=false,last=0,score=0,streak=0,time=30,best=Number(localStorage.zeroGHoopBest||0),shooter,hoop,ball=null,angle=-.62,sparks=[],moving=0,timer=0,shotT=0;
function reset(){active=true;last=performance.now();score=0;streak=0;time=30;moving=0;timer=0;ball=null;shooter={x:140,y:360};hoop={x:540,y:175,r:40,vx:38};$('title').classList.add('hidden');$('over').classList.add('hidden');hud()}
function hud(){$('score').textContent='SCORE '+String(Math.floor(score)).padStart(5,'0');$('streak').textContent='STREAK '+streak;$('time').textContent='TIME '+Math.ceil(time);$('best').textContent='BEST '+String(Math.floor(best)).padStart(5,'0')}
function spark(x,y,c){for(let i=0;i<8;i++)sparks.push({x,y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,t:0,life:.4,c})}
function shoot(){if(!active||ball||time<=0)return;const dx=Math.cos(angle),dy=Math.sin(angle);ball={x:shooter.x+dx*28,y:shooter.y+dy*28,vx:dx*250,vy:dy*250,active:true};shotT=1.1}
function update(dt){if(time>0){time-=dt;if(time<=0){time=0;finish()}}shooter.x+=moving*150*dt;shooter.x=Math.max(60,Math.min(220,shooter.x));hoop.x+=hoop.vx*dt;if(hoop.x<150||hoop.x>W-100)hoop.vx*=-1;if(ball){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=60*dt;const dx=ball.x-hoop.x,dy=ball.y-hoop.y,d=Math.hypot(dx,dy);if(d<hoop.r-6&&ball.active){const center=d<10,ring=d<hoop.r-20;score+=center?100:(ring?30:10);if(center||ring){streak++;score+=streak*5;spark(hoop.x,hoop.y,center?'#ffe45e':'#7df6ff')}else{streak=0}best=Math.max(best,score);localStorage.zeroGHoopBest=best;ball.active=false;ball=null;hud()}else if(ball.x< -20||ball.x>W+20||ball.y>H+30){ball=null}}for(const p of sparks){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;sparks=sparks.filter(q=>q.t<q.life)}timer-=dt;if(timer<=0&&moving){moving=0}shotT=Math.max(0,shotT-dt);hud()}
function finish(){active=false;$('result').textContent='得分 '+Math.floor(score)+' · 连击 '+streak+' · 最高 '+Math.floor(best);$('over').classList.remove('hidden')}
function draw(){ctx.fillStyle='#060b1c';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(360,200,20,360,200,430);g.addColorStop(0,'#0c1d3c');g.addColorStop(1,'#060a16');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<85;i++){ctx.fillStyle=i%9?'#3a5790':'#eafaff';ctx.fillRect((i*89)%W,(i*47)%H,i%9?1:2,i%9?1:2)}ctx.strokeStyle='rgba(100,225,255,.12)';ctx.lineWidth=1;for(let y=36;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='#26a8cf';ctx.lineWidth=2;ctx.strokeRect(W-130,26,104,22);ctx.strokeStyle='#6ceeff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(hoop.x,hoop.y,hoop.r,0,7);ctx.stroke();ctx.strokeStyle='rgba(108,238,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(hoop.x,hoop.y,hoop.r+14,0,7);ctx.stroke();ctx.fillStyle='#ffe45e';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText('●',hoop.x,hoop.y-2);ctx.textAlign='left';ctx.save();ctx.translate(shooter.x,shooter.y);ctx.rotate(angle);ctx.fillStyle='#7defff';ctx.shadowBlur=18;ctx.shadowColor='#2cddff';ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(-20,-14);ctx.lineTo(-12,0);ctx.lineTo(-20,14);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff5cc8';ctx.fillRect(-7,-7,14,14);ctx.restore();if(shotT>0){const ex=shooter.x+Math.cos(angle)*230,ey=shooter.y+Math.sin(angle)*230;ctx.setLineDash([7,9]);ctx.strokeStyle='rgba(125,246,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(shooter.x+Math.cos(angle)*40,shooter.y+Math.sin(angle)*40);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#7df6ff';ctx.beginPath();ctx.arc(ex,ey,5,0,7);ctx.fill()}if(ball){ctx.fillStyle='#fff3b0';ctx.shadowBlur=20;ctx.shadowColor='#ffdf55';ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();ctx.shadowBlur=0}for(const p of sparks){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}}
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(active)update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')moving=-1;if(k==='arrowright'||k==='d')moving=1;if(k===' '){shoot();e.preventDefault()}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d')moving=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='left')moving=-1;if(k==='right')moving=1;if(k==='shoot')shoot();b.classList.add('on')});b.addEventListener('pointerup',()=>{if(k==='left'||k==='right')moving=0;b.classList.remove('on')});b.addEventListener('pointercancel',()=>{if(k==='left'||k==='right')moving=0;b.classList.remove('on')})});cv.addEventListener('pointerdown',()=>{if(active)shoot()});function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');requestAnimationFrame(loop);draw();
</script></body></html>
