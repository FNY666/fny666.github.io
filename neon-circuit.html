<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>霓虹竞速</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#04050c;color:#effaff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#050916}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(95vw,780px);display:flex;justify-content:space-between;font:800 13px monospace;color:#b9f5ff;text-shadow:0 0 8px #1edfff}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#030510dd;text-align:center}.box{width:min(90vw,450px);padding:30px;border:1px solid #ff66d5;border-radius:20px;background:linear-gradient(145deg,#201439,#080a18);box-shadow:0 0 46px #ff35c855}.box h1{margin:0;font-size:clamp(40px,11vw,74px);color:#ff83db;text-shadow:0 0 18px #ff2cc8}.box p{color:#b1c8df;line-height:1.8}.btn,.back,.control{font:inherit;font-weight:900;color:#edffff;border:1px solid #68eaff;border-radius:999px;background:#0b506b}.btn{padding:13px 30px;font-size:16px}.hidden{display:none!important}.back{position:fixed;right:12px;top:10px;z-index:6;padding:8px 13px;font-size:12px}.controls{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);display:flex;gap:10px;z-index:6}.control{width:70px;height:48px;background:#112b43dd;touch-action:none;user-select:none}.control.nitro{color:#ffe75d;border-color:#ffe75d;background:#493514dd}.control:active{background:#24718a}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:7;padding:8px 14px;border:1px solid #ff77d9;border-radius:999px;background:#281333dd;font-size:12px}}
</style></head><body><div id="app"><canvas id="game" width="800" height="450"></canvas><div class="hud"><span id="pos">POS 4/4</span><span id="lap">LAP 1/3</span><span id="speed">SPEED 000</span><span id="best">BEST --</span></div><button class="back" id="back">返回星港</button><div class="controls"><button class="control" data-k="left">←</button><button class="control nitro" data-k="nitro">氮气</button><button class="control" data-k="right">→</button></div><div class="rotate">横屏竞速视野更佳 ⟳</div><div id="title" class="panel"><div class="box"><h1>霓虹竞速</h1><p>NEON CIRCUIT<br>穿越星港环形赛道，赢下最后一圈。</p><button class="btn" id="start">发车</button><p>← → / A D 转向<br>空格 / 氮气键加速，连续完成 3 圈</p></div></div><div id="over" class="panel hidden"><div class="box"><h1 id="overTitle">冲线</h1><p id="result"></p><button class="btn" id="again">再跑一圈</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=800,H=450,$=id=>document.getElementById(id),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let active=false,last=0,time=0,player,ai=[],keys={left:false,right:false,nitro:false},nitro=100,best=Number(localStorage.neonCircuitBest||0),particles=[];
const track=[];for(let i=0;i<96;i++){const a=i/96*Math.PI*2;track.push({x:400+260*Math.cos(a),y:225+145*Math.sin(a)})}
function reset(){active=true;last=performance.now();time=0;nitro=100;particles=[];player={p:0.015,lane:0,speed:.105,boost:0};ai=[{name:'紫电',p:.01,lane:-1,speed:.099,color:'#b98cff'},{name:'赤潮',p:.00,lane:1,speed:.103,color:'#ff638f'},{name:'青鸢',p:.02,lane:0,speed:.094,color:'#5cf0ff'}];$('title').classList.add('hidden');$('over').classList.add('hidden');hud()}
function point(p,lane=0){const z=((p%1)+1)%1,i=Math.floor(z*96),n=track[i],q=track[(i+1)%96],dx=q.x-n.x,dy=q.y-n.y,len=Math.hypot(dx,dy)||1;return{x:n.x-dy/len*lane*20,y:n.y+dx/len*lane*20,dx,dy}}
function hud(){const me={p:player.p,name:'你'},all=[me,...ai].sort((a,b)=>b.p-a.p),rank=all.findIndex(x=>x===me)+1; $('pos').textContent='POS '+rank+'/4';$('lap').textContent='LAP '+Math.min(3,Math.floor(player.p)+1)+'/3';$('speed').textContent='SPEED '+String(Math.round(player.speed*900)).padStart(3,'0');$('best').textContent='BEST '+(best?best.toFixed(2):'--')}
function spark(x,y,c){for(let i=0;i<4;i++)particles.push({x,y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,t:0,life:.35,c})}
function end(){active=false;const me={p:player.p,name:'你'},all=[me,...ai].sort((a,b)=>b.p-a.p),rank=all.findIndex(x=>x===me)+1;const place=['冠军','亚军','季军','殿军'][rank-1];if(rank===1){best=best?Math.min(best,time):time;localStorage.neonCircuitBest=best}$('overTitle').textContent=rank===1?'冲线冠军':'比赛结束';$('result').textContent=place+' · 用时 '+time.toFixed(2)+'s · 最佳 '+(best?best.toFixed(2):'--')+'s · 3 圈完成';$('over').classList.remove('hidden')}
function tick(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(active){time+=dt;const steer=(keys.right?1:0)-(keys.left?1:0);player.lane=clamp(player.lane+steer*dt*2.3,-1.65,1.65);const pushing=keys.nitro&&nitro>0;if(pushing){nitro=Math.max(0,nitro-dt*36);player.boost=Math.min(.14,player.boost+dt*.8)}else{nitro=Math.min(100,nitro+dt*8);player.boost=Math.max(0,player.boost-dt*.35)}player.speed=.105+player.boost+Math.max(0,Math.sin(player.p*20))*0.003;player.p+=player.speed*dt;for(const r of ai){r.p+=r.speed*dt+Math.sin(time*2+r.p*8)*.00003}if(Math.floor(player.p)!==Math.floor(player.p-player.speed*dt))spark(point(player.p,player.lane).x,point(player.p,player.lane).y,'#ffe45e');if(player.p>=3||ai.some(r=>r.p>=3))end();hud()}for(const q of particles){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt}particles=particles.filter(q=>q.t<q.life);draw();requestAnimationFrame(tick)}
function drawCar(o,main=false){const pt=point(o.p,o.lane),ang=Math.atan2(pt.dy,pt.dx);ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(ang);ctx.fillStyle=main?'#ffe45e':o.color;ctx.shadowBlur=main?18:10;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,-8);ctx.lineTo(-17,0);ctx.lineTo(-12,8);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0b1728';ctx.fillRect(-3,-4,8,8);ctx.restore()}
function draw(){ctx.fillStyle='#050817';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(400,220,30,400,220,460);g.addColorStop(0,'#1c2d62');g.addColorStop(1,'#070a18');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<80;i++){ctx.fillStyle=i%8?'#385187':'#eaffff';ctx.fillRect((i*73)%W,(i*47)%H,i%8?1:2,i%8?1:2)}ctx.lineCap='round';ctx.strokeStyle='#0a101f';ctx.lineWidth=96;ctx.beginPath();track.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();ctx.strokeStyle='#245778';ctx.lineWidth=78;ctx.beginPath();track.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();ctx.setLineDash([12,13]);ctx.strokeStyle='rgba(197,231,255,.42)';ctx.lineWidth=2;ctx.beginPath();track.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#ffe45e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(track[0].x-35,track[0].y-55);ctx.lineTo(track[0].x+35,track[0].y+55);ctx.stroke();for(const r of ai)drawCar(r);if(player)drawCar(player,true);for(const q of particles){ctx.globalAlpha=1-q.t/q.life;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4);ctx.globalAlpha=1}ctx.fillStyle='#9deaff';ctx.font='bold 12px monospace';ctx.fillText('NITRO '+Math.round(nitro)+'%',18,H-18)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '||k==='w')keys.nitro=true});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' '||k==='w')keys.nitro=false});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false)});function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');requestAnimationFrame(tick);draw();
</script></body></html>
