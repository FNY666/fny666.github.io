<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星骸回收</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050c;color:#eafaff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#05091a}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(95vw,740px);display:flex;justify-content:space-between;font:800 13px monospace;color:#a4f6ff;text-shadow:0 0 8px #17dfff}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(2,5,14,.86);text-align:center}.box{width:min(90vw,450px);padding:28px 30px;border:1px solid #62eaff;border-radius:20px;background:linear-gradient(145deg,rgba(9,26,57,.98),rgba(3,8,19,.98));box-shadow:0 0 46px #168fab44}.box h1{margin:0;font-size:clamp(38px,10vw,72px);color:#75f2ff;text-shadow:0 0 16px #16dfff}.box p{color:#a7c0da;line-height:1.8}.btn,.back,.control{font:inherit;font-weight:800;color:#edffff;background:#0c4e6a;border:1px solid #65edff;border-radius:999px}.btn{display:block;margin:12px auto;padding:13px 30px;font-size:16px}.hidden{display:none!important}.back{position:fixed;right:12px;top:10px;z-index:6;padding:8px 13px;font-size:12px}.controls{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:6;display:grid;grid-template-columns:repeat(5,58px);gap:8px}.control{width:58px;height:46px;display:grid;place-items:center;background:#0a263cdd;touch-action:none;user-select:none;font-size:12px}.control.mine{color:#ffe45e;border-color:#ffe45e;background:#3b3214dd}.control.dock{color:#b89cff;border-color:#b89cff;background:#21163bdd}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:7;padding:8px 14px;border:1px solid #65edff;border-radius:999px;background:#0b2139dd;font-size:12px}}
</style></head><body><div id="app"><canvas id="game" width="800" height="450"></canvas><div class="hud"><span id="fuel">FUEL 100%</span><span id="cargo">CARGO 0/8</span><span id="credits">CREDITS 0000</span></div><button class="back" id="back">返回星港</button><div class="controls"><div class="control" data-k="left">◀</div><div class="control" data-k="up">上升</div><div class="control mine" id="mine">采集</div><div class="control" data-k="down">下潜</div><div class="control" data-k="right">▶</div></div><div class="rotate">横屏操作采矿艇 ⟳</div><div id="title" class="panel"><div class="box"><h1>星骸回收</h1><p>NEBULA SALVAGE<br>在失重星云里找到资源，然后活着返航</p><button class="btn" id="start">启动采矿艇</button><p>方向键 / WASD 移动<br>靠近星骸后按空格或“采集”装舱<br>货舱满或燃料不足前返回蓝色星港</p></div></div><div id="over" class="panel hidden"><div class="box"><h1 id="overTitle">任务结束</h1><p id="result"></p><button class="btn" id="again">再次出航</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=800,H=450;const $=id=>document.getElementById(id);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let active=false,last=0,fuel=100,cargo=0,credits=Number(localStorage.nebulaSalvageCredits||0),best=Number(localStorage.nebulaSalvageBest||0),time=0,keys={left:false,right:false,up:false,down:false},ship,rocks=[],particles=[],dock={x:92,y:350},status='';
function reset(){active=true;last=performance.now();fuel=100;cargo=0;time=0;status='SCAN ONLINE';ship={x:180,y:350,vx:0,vy:0,angle:0};rocks=[];particles=[];for(let i=0;i<13;i++)rocks.push({x:180+Math.random()*560,y:70+Math.random()*280,r:8+Math.random()*13,res:1+Math.floor(Math.random()*3),hit:false});$('title').classList.add('hidden');$('over').classList.add('hidden');hud()}
function hud(){$('fuel').textContent='FUEL '+Math.max(0,Math.ceil(fuel))+'%';$('cargo').textContent='CARGO '+cargo+'/8';$('credits').textContent='CREDITS '+String(credits).padStart(4,'0')}
function fx(x,y,col){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,t:0,life:.4,c:col})}
function mine(){if(!active||cargo>=8)return;let r=rocks.find(q=>!q.hit&&Math.hypot(q.x-ship.x,q.y-ship.y)<q.r+28);if(!r){status='未锁定星骸';return}r.hit=true;cargo++;fuel=Math.max(0,fuel-2);status='资源已装舱 · '+cargo+'/8';fx(r.x,r.y,'#ffe45e');hud()}
function sell(){if(Math.hypot(ship.x-dock.x,ship.y-dock.y)>48){status='靠近蓝色星港才能返航';return}if(cargo){const gain=cargo*35;credits+=gain;best=Math.max(best,credits);localStorage.nebulaSalvageCredits=credits;localStorage.nebulaSalvageBest=best;status='卸货完成 +'+gain+' credits'}cargo=0;fuel=100;hud()}
function end(title,msg){active=false;$('overTitle').textContent=title;$('result').textContent=msg;$('over').classList.remove('hidden')}
function tick(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;if(active){time+=dt;const ax=(keys.right?1:0)-(keys.left?1:0),ay=(keys.down?1:0)-(keys.up?1:0);ship.vx+=ax*180*dt;ship.vy+=ay*180*dt;ship.vx*=Math.pow(.04,dt);ship.vy*=Math.pow(.04,dt);ship.x=clamp(ship.x+ship.vx*dt,28,W-28);ship.y=clamp(ship.y+ship.vy*dt,40,H-55);if(ax||ay)fuel-=dt*(1.8+Math.abs(ship.vx+ship.vy)*.002);if(fuel<=0)end('燃料耗尽','采矿艇漂出星云 · 本次回收 '+cargo+' 单位');if(cargo>=8)status='货舱已满 · 返回蓝色星港卸货';for(const r of rocks){if(!r.hit&&Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+19){r.x+=Math.sin(time*3+r.y)*dt*5;r.y+=Math.cos(time*2+r.x)*dt*5}}for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.t<p.life);hud()}draw();requestAnimationFrame(tick)}
function draw(){ctx.fillStyle='#05091a';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(400,220,20,400,220,500);g.addColorStop(0,'#162859');g.addColorStop(1,'#050918');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<90;i++){ctx.fillStyle=i%7===0?'#fff':'#42588d';ctx.fillRect((i*91)%W,(i*53)%330,i%7===0?2:1,i%7===0?2:1)}ctx.strokeStyle='rgba(105,215,255,.1)';for(let y=45;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='#5ceeff';ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor='#36eaff';ctx.beginPath();ctx.arc(dock.x,dock.y,30,0,7);ctx.stroke();ctx.fillStyle='#7ff8ff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText('DOCK',dock.x,dock.y+4);ctx.shadowBlur=0;for(const r of rocks)if(!r.hit){ctx.fillStyle=['#ff6e9e','#ffe45e','#a68cff'][r.res-1];ctx.shadowBlur=14;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.moveTo(r.x-r.r,r.y);ctx.lineTo(r.x-3,r.y-r.r);ctx.lineTo(r.x+r.r,r.y-3);ctx.lineTo(r.x+3,r.y+r.r);ctx.lineTo(r.x-r.r,r.y+4);ctx.closePath();ctx.fill();ctx.shadowBlur=0}ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(Math.atan2(ship.vy,ship.vx)||0);ctx.fillStyle='#70f3ff';ctx.shadowBlur=18;ctx.shadowColor='#25dfff';ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-16,-13);ctx.lineTo(-11,0);ctx.lineTo(-16,13);ctx.closePath();ctx.fill();ctx.fillStyle='#ff65c8';ctx.fillRect(-5,-5,10,10);ctx.restore();for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}ctx.fillStyle='#b4d5e8';ctx.font='12px monospace';ctx.textAlign='left';ctx.fillText(status,16,H-18);ctx.textAlign='center';}
function tap(el,fn){el.addEventListener('pointerup',fn);el.addEventListener('click',fn)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k==='arrowup'||k==='w')keys.up=true;if(k==='arrowdown'||k==='s')keys.down=true;if(k===' '){mine();e.preventDefault()}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k==='arrowup'||k==='w')keys.up=false;if(k==='arrowdown'||k==='s')keys.down=false});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false)});tap($('mine'),mine);tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');tap($('overTitle'),()=>{});tap($('game'),e=>{});document.getElementById('mine').addEventListener('dblclick',mine);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e')sell()});const dockBtn=document.createElement('button');dockBtn.className='control dock';dockBtn.textContent='返航';dockBtn.onclick=sell;document.querySelector('.controls').appendChild(dockBtn);ship={x:180,y:350,vx:0,vy:0};status='待命';requestAnimationFrame(tick);draw();
</script></body></html>
