<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星轨防线</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03060d;color:#dff8ff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#050b18}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,720px);display:flex;justify-content:space-between;gap:10px;font:700 13px monospace;color:#9cf7ff;text-shadow:0 0 8px #1bd8ff}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(2,6,15,.82);text-align:center}.box{width:min(88vw,410px);padding:28px 30px;border:1px solid #45b9d0;border-radius:18px;background:linear-gradient(145deg,rgba(9,27,52,.97),rgba(4,9,19,.97));box-shadow:0 0 42px #1684aa44}.box h1{margin:0;font-size:clamp(38px,10vw,68px);color:#75f4ff;text-shadow:0 0 16px #11dfff}.box p{color:#9eb9d4;line-height:1.8}.btn,.back,.touch div{font:inherit;font-weight:800;color:#eaffff;background:#0c506a;border:1px solid #68edff;border-radius:999px}.btn{display:block;margin:12px auto;padding:13px 28px;font-size:16px}.hidden{display:none!important}.back{position:fixed;right:12px;top:10px;z-index:6;padding:8px 13px;font-size:12px}.touch{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:13px}.touch div{width:68px;height:48px;display:grid;place-items:center;background:#09243abb;touch-action:none;user-select:none}.touch div:active{background:#117a96}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:7;padding:8px 14px;border:1px solid #69efff;border-radius:999px;background:#0b2139dd;font-size:12px}}
</style></head><body><div id="app"><canvas id="game" width="800" height="450"></canvas><div class="hud"><span id="shield">SHIELD 100%</span><span id="wave">WAVE 01</span><span id="score">SCORE 000000</span></div><button class="back" id="back">返回星港</button><div class="touch"><div data-k="left">←</div><div data-k="fire">发射</div><div data-k="right">→</div></div><div class="rotate">横屏部署炮台 ⟳</div><div id="title" class="panel"><div class="box"><h1>星轨防线</h1><p>STARLINE DEFENSE<br>守住最后一座轨道城</p><button class="btn" id="start">启动防线</button><p>← → 移动炮台　空格 / 发射键开火<br>击落无人机，守护护盾核心</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>防线失守</h1><p id="result"></p><button class="btn" id="again">重新部署</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=800,H=450,BASE=405;
let running=false,last=0,spawnT=0,fireT=0,wave=1,score=0,shield=100,best=Number(localStorage.starlineBest||0),keys={left:false,right:false,fire:false},cannon,drones=[],shots=[],sparks=[];
const $=id=>document.getElementById(id); const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){running=true;last=0;spawnT=0;fireT=0;wave=1;score=0;shield=100;cannon={x:400,y:BASE-20};drones=[];shots=[];sparks=[];$('title').classList.add('hidden');$('over').classList.add('hidden');hud()}
function hud(){$('shield').textContent='SHIELD '+Math.max(0,Math.ceil(shield))+'%';$('wave').textContent='WAVE '+String(wave).padStart(2,'0');$('score').textContent='SCORE '+String(score).padStart(6,'0')}
function spawnDrone(){const r=Math.random();drones.push({x:35+Math.random()*730,y:-25,w:r<.2?30:22,h:r<.2?30:22,vy:(34+wave*3)*(r<.2?0.72:1),hp:r<.2?3:1,big:r<.2})}
function fire(){if(!running||fireT>0)return;fireT=.18;let target=drones[0],bestD=1e9;for(const d of drones){const q=Math.abs(d.x-cannon.x)+d.y*.16;if(q<bestD){bestD=q;target=d}}shots.push({x:cannon.x,y:cannon.y-20,tx:target?target.x:cannon.x,ty:target?target.y:30,life:.22});}
function boom(x,y,color='#ffdc5e'){for(let i=0;i<12;i++)sparks.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:0,life:.35,c:color})}
function lose(){running=false;$('result').textContent='得分 '+score+' · 波次 '+wave+' · 护盾 '+Math.max(0,Math.ceil(shield))+'% · 最高 '+best;$('over').classList.remove('hidden')}
function tick(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;if(running){spawnT-=dt;fireT-=dt;if(spawnT<=0){spawnT=Math.max(.22,.85-wave*.018);spawnDrone()}wave=1+Math.floor(score/600);cannon.x+=((keys.right?1:0)-(keys.left?1:0))*300*dt;cannon.x=clamp(cannon.x,32,768);if(keys.fire)fire();for(const s of shots){s.life-=dt;s.x+=(s.tx-s.x)*dt/Math.max(.01,s.life+dt);s.y+=(s.ty-s.y)*dt/Math.max(.01,s.life+dt);if(s.life<=0){let hit=drones.find(d=>Math.hypot(d.x-s.tx,d.y-s.ty)<38);if(hit){hit.hp--;boom(hit.x,hit.y,hit.big?'#ff6c98':'#ffdc5e');if(hit.hp<=0){score+=hit.big?180:80;best=Math.max(best,score);localStorage.starlineBest=best;drones=drones.filter(d=>d!==hit)}}}}shots=shots.filter(s=>s.life>0);for(const d of drones){d.y+=d.vy*dt;if(d.y>d.h+BASE-70){shield-=d.big?12:7;boom(d.x,BASE-35,'#ff4d8d');drones=drones.filter(q=>q!==d);if(shield<=0){shield=0;lose()}}}for(const p of sparks){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}sparks=sparks.filter(p=>p.t<p.life);hud()}draw();requestAnimationFrame(tick)}
function draw(){ctx.fillStyle='#050b18';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,BASE);g.addColorStop(0,'#050b20');g.addColorStop(1,'#0c2440');ctx.fillStyle=g;ctx.fillRect(0,0,W,BASE);ctx.strokeStyle='#124b72';ctx.lineWidth=1;for(let y=40;y<BASE;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<16;i++){ctx.fillStyle=i%3?'#80dfff':'#ffca5c';ctx.fillRect((i*137+23)%W,(i*71+29)%220,2,2)}ctx.fillStyle='#0a3246';ctx.fillRect(0,BASE,W,H-BASE);ctx.fillStyle='#54eeff';ctx.fillRect(0,BASE,W,3);ctx.fillStyle='#173b50';ctx.fillRect(0,BASE+13,W,8);ctx.fillStyle='#75f4ff';ctx.beginPath();ctx.moveTo(cannon.x,BASE-55);ctx.lineTo(cannon.x-24,BASE-5);ctx.lineTo(cannon.x+24,BASE-5);ctx.closePath();ctx.fill();ctx.fillStyle='#ff5bc8';ctx.fillRect(cannon.x-7,BASE-38,14,8);for(const d of drones){ctx.fillStyle=d.big?'#ff4d8d':'#b89cff';ctx.shadowBlur=14;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(d.x-d.w/2,d.y-d.h/2,d.w,d.h);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(d.x-4,d.y-3,8,5)}for(const s of shots){ctx.fillStyle='#fff2a0';ctx.shadowBlur=12;ctx.shadowColor='#ffe45e';ctx.fillRect(s.x-3,s.y-3,6,6);ctx.shadowBlur=0}for(const p of sparks){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key===' '||e.key.toLowerCase()==='f')keys.fire=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key===' '||e.key.toLowerCase()==='f')keys.fire=false});document.querySelectorAll('.touch div').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='fire')fire();else keys[k]=true});b.addEventListener('pointerup',()=>{if(k!=='fire')keys[k]=false});b.addEventListener('pointercancel',()=>{if(k!=='fire')keys[k]=false})});$('start').addEventListener('click',reset);$('again').addEventListener('click',reset);$('back').addEventListener('click',()=>location.href='https://fny666.github.io/arcade.html');$('hall').addEventListener('click',()=>location.href='https://fny666.github.io/arcade.html');cannon={x:400,y:BASE-20};requestAnimationFrame(tick);draw();
</script></body></html>
