<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星港调度</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#040710;color:#e9fbff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#061022}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,720px);display:flex;justify-content:space-between;font:800 13px monospace;color:#a5f5ff;text-shadow:0 0 8px #18dfff}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(3,6,16,.86);text-align:center}.box{width:min(90vw,440px);padding:28px 30px;border:1px solid #63ebff;border-radius:20px;background:linear-gradient(145deg,rgba(10,28,56,.98),rgba(4,8,19,.98));box-shadow:0 0 45px #168fab44}.box h1{margin:0;font-size:clamp(38px,11vw,74px);color:#72f5ff;text-shadow:0 0 16px #13dfff}.box p{color:#a6c2dc;line-height:1.8}.btn,.back{font:inherit;font-weight:800;color:#edffff;background:#0c506a;border:1px solid #65efff;border-radius:999px}.btn{display:block;margin:12px auto;padding:13px 30px;font-size:16px}.hidden{display:none!important}.back{position:fixed;right:12px;top:10px;z-index:6;padding:8px 13px;font-size:12px}.tools{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:8px;align-items:center}.tools button{font:800 12px monospace;color:#dffaff;background:#0d2a43;border:1px solid #4bcde1;border-radius:999px;padding:9px 13px;touch-action:manipulation}.tools button:active{background:#16627a}.status{position:fixed;left:12px;bottom:15px;z-index:4;color:#7bb4c8;font:700 11px monospace}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:7;padding:8px 14px;border:1px solid #63ebff;border-radius:999px;background:#0b2139dd;font-size:12px}}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="score">CREDITS 0000</span><span id="day">CYCLE 01</span><span id="served">SERVED 000</span></div><button class="back" id="back">返回星港</button><div class="status" id="status">点击两个星港节点连接航线</div><div class="tools"><button id="newLine">新建航线</button><button id="upgrade">升级枢纽 200</button></div><div class="rotate">横屏调度星港 ⟳</div><div id="title" class="panel"><div class="box"><h1>星港调度</h1><p>STARPORT TRANSIT<br>为未来城市规划一套不会崩溃的航线</p><button class="btn" id="start">启动调度</button><p>依次点击两个节点建立航线<br>连接同色乘客与目标站点，避免拥堵</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>系统过载</h1><p id="result"></p><button class="btn" id="again">重新调度</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=720,H=405;const $=id=>document.getElementById(id);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const SHAPES=['●','◆','▲','■'];const COLORS=['#ff719e','#ffe35d','#71e9ff','#a48cff'];
const stations=[{x:110,y:108,shape:0,name:'黎明港'},{x:275,y:72,shape:1,name:'云环站'},{x:470,y:92,shape:2,name:'天穹港'},{x:610,y:165,shape:3,name:'暮光站'},{x:515,y:300,shape:0,name:'潮汐港'},{x:220,y:300,shape:1,name:'中枢站'}];
let active=false,last=0,clock=0,cycle=1,score=0,served=0,best=Number(localStorage.starportTransitBest||0),overload=0,selected=-1,connections=[],passengers=[],nextSpawn=0,capacity=3,particles=[];
function reset(){active=true;last=performance.now();clock=0;cycle=1;score=0;served=0;overload=0;selected=-1;connections=[];passengers=[];nextSpawn=0;capacity=3;$('title').classList.add('hidden');$('over').classList.add('hidden');stations.forEach(s=>s.queue=0);hud();status('点击两个节点连接航线')}
function hud(){$('score').textContent='CREDITS '+String(Math.floor(score)).padStart(4,'0');$('day').textContent='CYCLE '+String(cycle).padStart(2,'0');$('served').textContent='SERVED '+String(served).padStart(3,'0')}
function status(s){$('status').textContent=s}
function edge(a,b){return connections.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a))}
function connect(a,b){if(a===b)return;if(edge(a,b)){status('航线已存在 · 选择另一节点');return}if(connections.length>=capacity){status('航线容量已满 · 升级枢纽');return}connections.push({a,b,phase:Math.random()});status('航线建立 · 继续连接节点')}
function nearest(mx,my){let bi=-1,bd=35;stations.forEach((s,i)=>{const d=Math.hypot(mx-s.x,my-s.y);if(d<bd){bd=d;bi=i}});return bi}
function makePassenger(){const a=Math.floor(Math.random()*stations.length);let b=Math.floor(Math.random()*stations.length);while(b===a)b=Math.floor(Math.random()*stations.length);passengers.push({from:a,to:b,shape:stations[b].shape,x:stations[a].x,y:stations[a].y,edge:null,progress:0,age:0});stations[a].queue=(stations[a].queue||0)+1}
function routeNext(p){const q=[];for(const e of connections){if(e.a===p.from)q.push(e.b);if(e.b===p.from)q.push(e.a)}if(!q.length)return -1;let target=q.reduce((best,n)=>{const d=Math.hypot(stations[n].x-stations[p.to].x,stations[n].y-stations[p.to].y);return d<best.d?{n,d}:best},{n:-1,d:1e9});return target.n}
function dispatch(){for(const p of passengers){if(p.edge!==null)continue;if(p.from===p.to){served++;score+=50;p.done=true;burst(p.x,p.y, '#ffe35d');continue}const n=routeNext(p);if(n<0)continue;p.edge={a:p.from,b:n};p.progress=0;stations[p.from].queue=Math.max(0,(stations[p.from].queue||0)-1)}}
function burst(x,y,c){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,t:0,life:.4,c})}
function tick(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(active){clock+=dt;nextSpawn-=dt;if(nextSpawn<=0){nextSpawn=Math.max(.35,1.25-cycle*.035);makePassenger();dispatch()}cycle=1+Math.floor(clock/18);if(clock>cycle*18-17)cycle++;for(const p of passengers){p.age+=dt;if(p.edge!==null){const a=stations[p.edge.a],b=stations[p.edge.b];p.progress+=dt*(.38+Math.min(score,3000)*.00001);p.x=a.x+(b.x-a.x)*p.progress;p.y=a.y+(b.y-a.y)*p.progress;if(p.progress>=1){p.from=p.edge.b;p.edge=null;p.progress=0;if(p.from===p.to){served++;score+=50;p.done=true;burst(p.x,p.y,COLORS[p.shape])}else dispatch()}}else if(p.age>10){const s=stations[p.from];overload+=(s.queue||0)>4?dt:0}}passengers=passengers.filter(p=>!p.done);stations.forEach(s=>{if((s.queue||0)>5)overload+=dt*.4});if(overload>8)end();if(score>best){best=score;localStorage.starportTransitBest=best}hud()}for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.t<p.life);draw();requestAnimationFrame(tick)}
function end(){active=false;$('result').textContent='调度得分 '+Math.floor(score)+' · 已服务 '+served+' · 最高 '+best;$('over').classList.remove('hidden');}
function draw(){ctx.fillStyle='#050b18';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07132d');g.addColorStop(1,'#120b29');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<70;i++){ctx.fillStyle=i%8?'#304c7e':'#dffaff';ctx.fillRect((i*83)%W,(i*47)%250,i%8?1:2,i%8?1:2)}ctx.strokeStyle='rgba(97,196,255,.13)';ctx.lineWidth=1;for(let y=30;y<H;y+=27){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const e of connections){const a=stations[e.a],b=stations[e.b];ctx.strokeStyle='#2484a1';ctx.shadowBlur=8;ctx.shadowColor='#28dfff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#8ff8ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(const p of passengers){ctx.fillStyle=COLORS[p.shape];ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.shadowBlur=0}for(let i=0;i<stations.length;i++){const s=stations[i],q=s.queue||0,sel=i===selected;ctx.fillStyle=sel?'#ffe35d':'#0e2b4b';ctx.strokeStyle=sel?'#fff4a0':COLORS[s.shape];ctx.lineWidth=sel?4:2;ctx.shadowBlur=sel?18:8;ctx.shadowColor=COLORS[s.shape];ctx.beginPath();ctx.arc(s.x,s.y,22+Math.min(q,5)*1.2,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=COLORS[s.shape];ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SHAPES[s.shape],s.x,s.y);ctx.font='10px monospace';ctx.fillStyle='#d8eaff';ctx.fillText(s.name,s.x,s.y+38);if(q){ctx.fillStyle=q>4?'#ff5b7d':'#b8d4ed';ctx.fillText('QUEUE '+q,s.x,s.y-34)}}ctx.textAlign='left';ctx.textBaseline='alphabetic';for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}if(active&&overload>0){ctx.fillStyle='#ff5b7d';ctx.font='bold 11px monospace';ctx.fillText('SYSTEM LOAD '+Math.min(99,Math.round(overload/8*100))+'%',16,H-18)}}
cv.addEventListener('pointerdown',e=>{if(!active)return;const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height,i=nearest(mx,my);if(i<0){selected=-1;status('点击两个星港节点连接航线');return}if(selected<0){selected=i;status(stations[i].name+' 已选中 · 点击目标节点')}else{connect(selected,i);selected=-1}});
function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}
tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');tap($('newLine'),()=>{selected=-1;status('选择两个未连接节点');});tap($('upgrade'),()=>{if(score>=200){score-=200;capacity++;status('枢纽升级完成 · 可用航线 '+capacity)}else status('积分不足 · 需要 200 credits');hud()});requestAnimationFrame(tick);draw();
</script></body></html>
