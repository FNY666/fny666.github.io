<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>量子宠物舱</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050812;color:#eaffff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}body{overflow:auto}#app{min-height:100vh;padding:16px 14px 28px;background:radial-gradient(circle at 50% 0,#17344c,#080c19 48%,#03050c)}.top{max-width:860px;margin:auto;display:flex;justify-content:space-between;gap:10px}.logo{font-size:clamp(28px,8vw,60px);font-weight:900;color:#74f4ff;letter-spacing:.1em;text-shadow:0 0 15px #18dcff}.sub{font:11px monospace;color:#9bbbd3;letter-spacing:.18em;margin-top:4px}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{padding:8px 9px;border:1px solid #3c7182;border-radius:10px;background:#0b1a2b;color:#aff5ff;font:800 11px monospace}.back{position:fixed;right:12px;top:10px;z-index:8;padding:9px 12px;border:1px solid #69edff;border-radius:999px;background:#0c4e65;color:#fff;font-weight:800}.layout{max-width:860px;margin:20px auto 0;display:grid;grid-template-columns:1fr .9fr;gap:14px}.pod,.care{border:1px solid #315d70;border-radius:20px;background:linear-gradient(145deg,#0d2337,#070d19);box-shadow:0 14px 32px #0008}.pod{padding:20px;text-align:center}.pod h2,.care h2{margin:0 0 12px;color:#8ff8ff;font-size:19px}.pet{height:250px;position:relative;display:grid;place-items:center;border:1px solid #2f8095;border-radius:18px;background:radial-gradient(circle at 50% 48%,#1c6880,#0a2035 46%,#06111e 75%);overflow:hidden}.pet:before,.pet:after{content:'';position:absolute;border:1px solid rgba(117,239,255,.18);border-radius:50%;width:240px;height:140px}.pet:before{transform:rotate(22deg)}.pet:after{transform:rotate(-22deg)}.orb{position:relative;z-index:1;width:122px;height:122px;border-radius:44% 56% 52% 48%;background:radial-gradient(circle at 35% 28%,#fff 0 4%,#9ffff4 7% 17%,#56b4cf 50%,#245e83 72%);box-shadow:0 0 34px #59f3ff99;animation:float 2.4s ease-in-out infinite}.orb:before,.orb:after{content:'';position:absolute;top:42px;width:13px;height:20px;border-radius:50%;background:#061a31}.orb:before{left:32px}.orb:after{right:32px}.orb .mouth{position:absolute;left:51px;top:72px;width:20px;height:9px;border-bottom:3px solid #17334a;border-radius:50%}.orb .fin{position:absolute;top:-23px;left:45px;width:30px;height:34px;background:#75f4ff;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 8px #46ecff)}@keyframes float{50%{transform:translateY(-7px) rotate(2deg)}}.pet-name{position:absolute;bottom:12px;z-index:2;color:#c5fbff;font:800 12px monospace;letter-spacing:.2em}.care{padding:16px}.care h2{color:#ffe177}.meter{margin:11px 0}.meter label{display:flex;justify-content:space-between;font:11px monospace;color:#a9c8da;margin-bottom:4px}.meter i{display:block;height:10px;border:1px solid #315b73;border-radius:10px;background:#0a1727;overflow:hidden}.meter b{display:block;height:100%;width:70%;background:linear-gradient(90deg,#ff5c9d,#ffe45e);transition:.25s}.meter.energy b{background:linear-gradient(90deg,#5cecff,#7effa9)}.meter.clean b{background:linear-gradient(90deg,#a88cff,#5cecff)}.meter.mood b{background:linear-gradient(90deg,#ff8ccc,#ffe45e)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}.action{padding:13px 6px;border:1px solid #62eaff;border-radius:12px;background:#0d3248;color:#edffff;font-weight:900;touch-action:manipulation}.action:active{background:#176f82;transform:scale(.98)}.note{min-height:48px;margin-top:14px;padding:11px;border-left:3px solid #ffe177;background:#111f31;color:#a8cada;font:11px monospace;line-height:1.6}.bottom{max-width:860px;margin:13px auto;color:#799eb2;font:11px monospace;display:flex;justify-content:space-between}.reset{border:1px solid #456b7d;border-radius:999px;background:#0b1b2b;color:#a9cede;padding:7px 10px}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,430px);padding:30px;border:1px solid #68edff;border-radius:20px;background:linear-gradient(145deg,#0d3545,#070b17);box-shadow:0 0 45px #25dff055}.box h1{margin:0;color:#79f6ff;font-size:clamp(38px,11vw,70px);text-shadow:0 0 18px #1bdfff}.box p{color:#a9c8da;line-height:1.8}.start{padding:13px 30px;border:1px solid #ffe177;border-radius:999px;background:#70550b;color:#fff4b6;font-weight:900;font-size:16px}.hidden{display:none!important}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:10px;right:10px;z-index:9;padding:7px 10px;border:1px solid #68edff;border-radius:999px;background:#0b2934ee;font:11px monospace}}@media(max-width:670px){.layout{grid-template-columns:1fr;margin-top:16px}.pod{padding:12px}.care{padding:12px}.pet{height:220px}.hud{max-width:170px}.actions{gap:7px}.action{padding:12px 5px;font-size:12px}}
</style></head><body><div id="app"><div class="top"><div><div class="logo">量子宠物舱</div><div class="sub">QUANTUM PET POD · CARE SIM</div></div><div class="hud"><span class="stat" id="age">AGE 01</span><span class="stat" id="bond">BOND 000</span><span class="stat" id="best">BEST 000</span></div></div><button class="back" id="back">返回星港</button><main class="layout"><section class="pod"><h2>宠物舱在线</h2><div class="pet"><div class="orb"><div class="fin"></div><div class="mouth"></div></div><div class="pet-name" id="petName">小星云 · QUANT-01</div></div><div class="note" id="note">它正在观察你。选择一项照料动作。</div></section><section class="care"><h2>照料控制台</h2><div class="meter"><label><span>饱腹 HUNGER</span><span id="hungerV">72%</span></label><i><b id="hunger"></b></i></div><div class="meter energy"><label><span>能量 ENERGY</span><span id="energyV">68%</span></label><i><b id="energy"></b></i></div><div class="meter clean"><label><span>清洁 CLEAN</span><span id="cleanV">84%</span></label><i><b id="clean"></b></i></div><div class="meter mood"><label><span>心情 MOOD</span><span id="moodV">76%</span></label><i><b id="mood"></b></i></div><div class="actions"><button class="action" data-a="feed">喂食 +饱腹</button><button class="action" data-a="play">陪玩 +心情</button><button class="action" data-a="clean">清洁 +卫生</button><button class="action" data-a="sleep">休眠 +能量</button></div></section></main><div class="bottom"><span id="status">CARE CYCLE ACTIVE · 状态每分钟轻微变化</span><button class="reset" id="reset">重置宠物</button></div><div class="rotate">横屏照料更清晰 ⟳</div><div id="title" class="panel"><div class="box"><h1>量子宠物舱</h1><p>QUANTUM PET POD<br>照料一只来自星云深处的小生命。</p><button class="start" id="start">唤醒宠物</button><p>喂食、陪玩、清洁或休眠。<br>你的选择会影响它的状态与成长。</p></div></div></div><script>
const $=id=>document.getElementById(id);let active=false,hunger=72,energy=68,clean=84,mood=76,age=1,bond=0,best=Number(localStorage.quantumPetBest||0),last=Date.now();const notes={feed:'它吞下了一颗星尘果，眼睛亮了起来。',play:'它在舱内追逐光点，心情变好了。',clean:'清洁脉冲完成，宠物舱恢复透明。',sleep:'进入低功耗休眠，能量正在回充。'};
function hud(){$('hunger').style.width=hunger+'%';$('energy').style.width=energy+'%';$('clean').style.width=clean+'%';$('mood').style.width=mood+'%';$('hungerV').textContent=Math.round(hunger)+'%';$('energyV').textContent=Math.round(energy)+'%';$('cleanV').textContent=Math.round(clean)+'%';$('moodV').textContent=Math.round(mood)+'%';$('age').textContent='AGE '+String(age).padStart(2,'0');$('bond').textContent='BOND '+String(bond).padStart(3,'0');$('best').textContent='BEST '+String(best).padStart(3,'0')}
function save(){try{localStorage.quantumPetState=JSON.stringify({hunger,energy,clean,mood,age,bond,last:Date.now()})}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.quantumPetState||'{}');if(s.age){const elapsed=Math.min(3600,(Date.now()-s.last)/1000);hunger=Math.max(0,s.hunger-elapsed*.002);energy=Math.max(0,s.energy-elapsed*.001);clean=Math.max(0,s.clean-elapsed*.0015);mood=Math.max(0,s.mood-elapsed*.001);age=s.age;bond=s.bond}}catch(e){}}
function start(){load();active=true;$('title').classList.add('hidden');$('note').textContent='它正在观察你。选择一项照料动作。';hud()}
function act(a){if(!active)return;const cost=a==='feed'?8:a==='play'?7:a==='clean'?5:0;if(a==='feed'){hunger=Math.min(100,hunger+25);energy=Math.max(0,energy-cost)}if(a==='play'){mood=Math.min(100,mood+22);energy=Math.max(0,energy-cost)}if(a==='clean'){clean=Math.min(100,clean+30);energy=Math.max(0,energy-cost)}if(a==='sleep'){energy=Math.min(100,energy+28);hunger=Math.max(0,hunger-4);mood=Math.min(100,mood+5)}bond+=10;age=1+Math.floor(bond/100);best=Math.max(best,bond);localStorage.quantumPetBest=best;$('note').textContent=notes[a];hud();save()}
function reset(){hunger=72;energy=68;clean=84;mood=76;age=1;bond=0;save();hud();$('note').textContent='新的量子宠物已唤醒。'}
function tick(){if(active){const now=Date.now();if(now-last>60000){const n=Math.floor((now-last)/60000);hunger=Math.max(0,hunger-n*2);energy=Math.max(0,energy-n);clean=Math.max(0,clean-n);mood=Math.max(0,mood-n);last=now;hud();save()}}requestAnimationFrame(tick)}
function tap(el,fn){el.addEventListener('pointerup',fn);el.addEventListener('click',fn)}tap($('start'),start);tap($('reset'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');document.querySelectorAll('[data-a]').forEach(b=>tap(b,()=>act(b.dataset.a)));hud();tick();
</script></body></html>
