<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>量子弹珠</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05060d;color:#effaff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}body{overflow:hidden}#app{min-height:100vh;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 0,#251548,#080a18 48%,#03050b)}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;box-shadow:0 0 55px #cb55ff33}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,740px);display:flex;justify-content:space-between;font:800 13px monospace;color:#c8f7ff;text-shadow:0 0 9px #2cdbff}.back{position:fixed;right:12px;top:10px;z-index:7;border:1px solid #75edff;border-radius:999px;background:#0d4562;color:#fff;padding:8px 12px;font-weight:800}.controls{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:6;display:flex;gap:12px}.control{width:72px;height:46px;border:1px solid #e17cff;border-radius:14px;background:#21133ddd;color:#ffdfff;font-weight:900;font-size:13px;touch-action:none;user-select:none}.control:active,.control.on{background:#863b9b;box-shadow:0 0 18px #e45dff}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:11px;left:10px;z-index:8;padding:7px 11px;border:1px solid #e17cff;border-radius:999px;background:#29133bdd;color:#ffe5ff;font:11px monospace}}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#04050ddd;text-align:center}.box{width:min(90vw,440px);padding:30px;border:1px solid #e17cff;border-radius:21px;background:linear-gradient(145deg,#25163e,#080b18);box-shadow:0 0 45px #d63dff55}.box h1{margin:0;font-size:clamp(42px,11vw,75px);color:#ff9de9;text-shadow:0 0 18px #e43dff}.box p{color:#c2c8e3;line-height:1.8}.start{padding:13px 30px;border:1px solid #ffe15e;border-radius:999px;background:#705515;color:#fff4b6;font-weight:900;font-size:16px}.hidden{display:none!important}.tip{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:3;color:#a991c6;font:11px monospace;white-space:nowrap}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="score">SCORE 00000</span><span id="balls">BALLS 3</span><span id="best">BEST 00000</span></div><button class="back" id="back">返回星港</button><div class="tip">←/A 与 →/D 控制挡板 · 双侧同时按可夹击 · 撞击能量环触发多球</div><div class="controls"><button class="control" data-k="left">左挡板</button><button class="control" data-k="launch">发射</button><button class="control" data-k="right">右挡板</button></div><div class="rotate">横屏玩量子弹珠 ⟳</div><div id="title" class="panel"><div class="box"><h1>量子弹珠</h1><p>QUANTUM PINBALL<br>在量子反应堆里，让能量球保持运行。</p><button class="start" id="start">启动机台</button><p>控制左右挡板，击打能量环与目标靶。<br>分数达到阈值后会触发 MULTIBALL。</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>球台静默</h1><p id="result"></p><button class="start" id="again">重新开始</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=720,H=405,$=id=>document.getElementById(id);let active=false,last=0,score=0,balls=3,best=Number(localStorage.quantumPinballBest||0),left=false,right=false,launch=false,ballsOn=[],sparks=[],targets=[],multi=false,notice='',noticeT=0;
const bumpers=[{x:205,y:120,r:27,c:'#ff6bd6',v:100},{x:360,y:78,r:25,c:'#6feaff',v:120},{x:515,y:120,r:27,c:'#ffe26d',v:100},{x:290,y:190,r:22,c:'#9c82ff',v:160},{x:430,y:190,r:22,c:'#70ffb5',v:160}];
const leftFlip={x:218,y:337,len:82,angle:-.42},rightFlip={x:502,y:337,len:82,angle:Math.PI+.42};
function reset(){active=true;score=0;balls=3;multi=false;notice='BALL READY';noticeT=1.2;sparks=[];targets=[{x:130,y:72,on:true,v:80},{x:590,y:72,on:true,v:80},{x:130,y:178,on:true,v:80},{x:590,y:178,on:true,v:80}];ballsOn=[];serve();$('title').classList.add('hidden');$('over').classList.add('hidden');hud()}
function serve(){if(balls<=0){finish();return}ballsOn.push({x:360,y:340,r:8,vx:(Math.random()-.5)*90,vy:-380});hud()}
function hud(){$('score').textContent='SCORE '+String(Math.floor(score)).padStart(5,'0');$('balls').textContent='BALLS '+balls;$('best').textContent='BEST '+String(Math.floor(best)).padStart(5,'0')}
function spark(x,y,c='#ffe45e'){for(let i=0;i<10;i++)sparks.push({x,y,vx:(Math.random()-.5)*190,vy:(Math.random()-.5)*190,t:0,life:.4,c})}
function addScore(v,msg){score+=v;best=Math.max(best,score);localStorage.quantumPinballBest=best;notice=msg+' +'+v;noticeT=.65;if(!multi&&score>=700){multi=true;ballsOn.push({x:360,y:190,r:8,vx:190,vy:-100});notice='MULTIBALL';noticeT=1.5}hud()}
function finish(){active=false;$('result').textContent='得分 '+Math.floor(score)+' · 余球 '+balls+' · 最高 '+Math.floor(best);$('over').classList.remove('hidden')}
function lineHit(b,p1,p2,activeFlip){const dx=p2.x-p1.x,dy=p2.y-p1.y,l2=dx*dx+dy*dy,t=Math.max(0,Math.min(1,((b.x-p1.x)*dx+(b.y-p1.y)*dy)/l2)),qx=p1.x+t*dx,qy=p1.y+t*dy,dist=Math.hypot(b.x-qx,b.y-qy);if(dist<b.r+7&&((activeFlip&&b.vy>0)||!activeFlip)){const nx=(b.x-qx)/(dist||1),ny=(b.y-qy)/(dist||1),dot=b.vx*nx+b.vy*ny;b.x=qx+nx*(b.r+8);b.y=qy+ny*(b.r+8);b.vx-=2*dot*nx;b.vy-=2*dot*ny;return true}return false}
function update(dt){for(const b of ballsOn){b.vy+=560*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.28,dt);if(b.x<b.r+34){b.x=b.r+34;b.vx=Math.abs(b.vx)*.9}if(b.x>W-b.r-34){b.x=W-b.r-34;b.vx=-Math.abs(b.vx)*.9}if(b.y<28){b.y=28;b.vy=Math.abs(b.vy)*.9}
for(const q of bumpers){const dx=b.x-q.x,dy=b.y-q.y,d=Math.hypot(dx,dy),min=b.r+q.r;if(d<min){const nx=dx/(d||1),ny=dy/(d||1),dot=b.vx*nx+b.vy*ny;b.x=q.x+nx*min;b.y=q.y+ny*min;b.vx-=2*dot*nx;b.vy-=2*dot*ny;b.vx+=nx*100;b.vy+=ny*100;spark(q.x,q.y,q.c);addScore(q.v,msg='RING')}}
for(const q of targets)if(q.on&&Math.hypot(b.x-q.x,b.y-q.y)<b.r+17){q.on=false;spark(q.x,q.y,'#ff8bce');addScore(q.v,'TARGET');setTimeout(()=>q.on=true,900)}
const lf={x:leftFlip.x,y:leftFlip.y},le={x:lf.x+Math.cos(leftFlip.angle+(left?-.45:0))*leftFlip.len,y:lf.y+Math.sin(leftFlip.angle+(left?-.45:0))*leftFlip.len};const rf={x:rightFlip.x,y:rightFlip.y},re={x:rf.x+Math.cos(rightFlip.angle+(right?.45:0))*rightFlip.len,y:rf.y+Math.sin(rightFlip.angle+(right?.45:0))*rightFlip.len};lineHit(b,lf,le,left);lineHit(b,rf,re,right)}ballsOn=ballsOn.filter(b=>b.y<H+30);if(ballsOn.length===0&&balls>0){balls--;notice='BALL LOST';noticeT=1;setTimeout(()=>{if(active)serve()},550)}for(const p of sparks){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}sparks=sparks.filter(p=>p.t<p.life);noticeT=Math.max(0,noticeT-.016);hud()}
function draw(){ctx.fillStyle='#070615';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(360,180,10,360,200,430);g.addColorStop(0,'#291c61');g.addColorStop(1,'#080918');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(120,160,255,.16)';ctx.lineWidth=1;for(let y=35;y<H;y+=25){ctx.beginPath();ctx.moveTo(28,y);ctx.lineTo(W-28,y);ctx.stroke()}ctx.strokeStyle='#312d68';ctx.lineWidth=5;ctx.strokeRect(28,28,W-56,H-53);ctx.strokeStyle='#e95bda';ctx.shadowBlur=16;ctx.shadowColor='#e95bda';ctx.strokeRect(36,36,W-72,H-69);ctx.shadowBlur=0;for(const q of bumpers){ctx.fillStyle=q.c;ctx.shadowBlur=18;ctx.shadowColor=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#17122d';ctx.beginPath();ctx.arc(q.x,q.y,8,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
for(const q of targets){ctx.fillStyle=q.on?'#ff83cf':'#38223d';ctx.shadowBlur=q.on?12:0;ctx.shadowColor='#ff61d0';ctx.fillRect(q.x-14,q.y-7,28,14);ctx.fillStyle=q.on?'#fff0fa':'#6b4568';ctx.fillRect(q.x-5,q.y-3,10,6);ctx.shadowBlur=0}
function flip(p,angle,pressed,col){const e={x:p.x+Math.cos(angle+(pressed?-.45:0))*p.len,y:p.y+Math.sin(angle+(pressed?-.45:0))*p.len};ctx.strokeStyle=col;ctx.lineWidth=13;ctx.lineCap='round';ctx.shadowBlur=12;ctx.shadowColor=col;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(e.x,e.y);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill()}flip(leftFlip,leftFlip.angle,left,'#ff76db');const reAngle=rightFlip.angle+(right?.45:0);ctx.strokeStyle='#6ceaff';ctx.lineWidth=13;ctx.lineCap='round';ctx.shadowBlur=12;ctx.shadowColor='#6ceaff';ctx.beginPath();ctx.moveTo(rightFlip.x,rightFlip.y);ctx.lineTo(rightFlip.x+Math.cos(reAngle)*rightFlip.len,rightFlip.y+Math.sin(reAngle)*rightFlip.len);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(rightFlip.x,rightFlip.y,8,0,7);ctx.fill();for(const b of ballsOn){ctx.fillStyle='#fff7ba';ctx.shadowBlur=22;ctx.shadowColor='#ffdf55';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff6de0';ctx.beginPath();ctx.arc(b.x-2,b.y-2,2,0,7);ctx.fill()}for(const p of sparks){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}if(noticeT>0){ctx.fillStyle='#ffe45e';ctx.font='bold 15px monospace';ctx.textAlign='center';ctx.fillText(notice,W/2,55);ctx.textAlign='left'}}
function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;if(active)update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')left=true;if(k==='arrowright'||k==='d')right=true;if(k===' '||k==='w')launch=true;e.preventDefault()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')left=false;if(k==='arrowright'||k==='d')right=false;if(k===' '||k==='w')launch=false});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='launch'){if(active&&ballsOn.length===0)serve()}else{if(k==='left')left=true;if(k==='right')right=true}b.classList.add('on')});b.addEventListener('pointerup',()=>{if(k==='left')left=false;if(k==='right')right=false;b.classList.remove('on')});b.addEventListener('pointercancel',()=>{if(k==='left')left=false;if(k==='right')right=false;b.classList.remove('on')})});function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');requestAnimationFrame(loop);draw();
</script></body></html>
