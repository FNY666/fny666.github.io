<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>霓虹节拍</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050611;color:#e9fbff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#060916}.hud{position:fixed;top:13px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,700px);display:flex;justify-content:space-between;font:800 13px monospace;color:#9cf7ff;text-shadow:0 0 8px #17dfff}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(3,5,16,.84);text-align:center}.box{width:min(88vw,430px);padding:28px 30px;border:1px solid #49c9df;border-radius:20px;background:linear-gradient(145deg,rgba(12,26,57,.98),rgba(5,8,21,.98));box-shadow:0 0 44px #158fa744}.box h1{margin:0;font-size:clamp(42px,11vw,76px);color:#ff7bd9;text-shadow:0 0 16px #ff29bc}.box p{color:#a5bfdf;line-height:1.8}.btn,.back,.key{font:inherit;font-weight:800;color:#edffff;background:#0c4c70;border:1px solid #65efff;border-radius:999px}.btn{display:block;margin:12px auto;padding:13px 30px;font-size:16px}.hidden{display:none!important}.back{position:fixed;right:12px;top:10px;z-index:6;padding:8px 13px;font-size:12px}.keys{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:12px}.key{width:58px;height:47px;display:grid;place-items:center;background:#18234dcc;touch-action:none;user-select:none}.key.active,.key:active{background:#9d3d9d;box-shadow:0 0 16px #ff65df}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:7;padding:8px 14px;border:1px solid #ff7bd9;border-radius:999px;background:#26153ddd;font-size:12px}}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="score">SCORE 000000</span><span id="combo">COMBO 0</span><span id="best">BEST 000000</span></div><button class="back" id="back">返回星港</button><div class="keys"><div class="key" data-lane="0">D</div><div class="key" data-lane="1">F</div><div class="key" data-lane="2">J</div><div class="key" data-lane="3">K</div></div><div class="rotate">横屏节拍更准 ⟳</div><div id="title" class="panel"><div class="box"><h1>霓虹节拍</h1><p>NEON BEAT<br>同步你的神经脉冲</p><button class="btn" id="start">开始演奏</button><p>D / F / J / K 或下方四个触屏键<br>音符落到节拍线时按下</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>演奏结束</h1><p id="result"></p><button class="btn" id="again">再来一曲</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=720,H=405,HIT=300;let active=false,last=0,elapsed=0,score=0,combo=0,best=Number(localStorage.neonBeatBest||0),miss=0,notes=[],particles=[],audio=null;const keys=[false,false,false,false];
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){active=true;last=performance.now();elapsed=0;score=0;combo=0;miss=0;notes=[];particles=[];$('title').classList.add('hidden');$('over').classList.add('hidden');hud();if(!audio){try{audio=new AudioContext()}catch(e){}}}
function hud(){ $('score').textContent='SCORE '+String(score).padStart(6,'0');$('combo').textContent='COMBO '+combo;$('best').textContent='BEST '+String(best).padStart(6,'0') }
function tone(freq=440){try{if(!audio)return;if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='square';g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.1)}catch(e){}}
function pattern(){return [0,1,2,3,1,3,0,2,0,1,3,2,3,1,2,0][Math.floor(elapsed/.42)%16]}
function spawn(){const lane=pattern();notes.push({lane,y:-20,hit:false});if(Math.random()<.23)notes.push({lane:(lane+2)%4,y:-92,hit:false})}
function hit(lane){if(!active)return;let bestN=null,bestD=999;for(const n of notes){if(n.lane===lane&&!n.hit){const d=Math.abs(n.y-HIT);if(d<bestD){bestD=d;bestN=n}}}if(!bestN||bestD>62){combo=0;miss++;tone(120);return}bestN.hit=true;const perfect=bestD<18,good=bestD<40;const pts=perfect?100:good?60:25;score+=pts*(1+Math.min(combo,20)*.05);combo++;best=Math.max(best,Math.floor(score));localStorage.neonBeatBest=best;tone([523,659,784,988][lane]);burst(88+lane*175,HIT,perfect?'#ffe45e':'#ff7bd9');hud()}
function burst(x,y,col){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:0,life:.35,c:col})}
function end(){active=false;$('result').textContent='得分 '+Math.floor(score)+' · 连击 '+combo+' · 失误 '+miss+' · 最高 '+best;$('over').classList.remove('hidden')}
function tick(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(active){elapsed+=dt;if(elapsed>.62){elapsed=0;spawn()}for(const n of notes)n.y+=(210+Math.min(score,3000)*.025)*dt;for(const n of notes)if(!n.hit&&n.y>HIT+75){n.hit=true;combo=0;miss++;}notes=notes.filter(n=>n.y<H+30&&!n.hit);for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.t<p.life);hud();if(miss>=12)end()}draw();requestAnimationFrame(tick)}
function draw(){ctx.fillStyle='#060916';ctx.fillRect(0,0,W,H);const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a0e2a');gr.addColorStop(1,'#12091f');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=27){ctx.strokeStyle='rgba(112,120,255,.13)';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<4;i++){const lx=90+i*175;ctx.fillStyle='rgba(66,114,170,.18)';ctx.fillRect(lx-40,0,80,H);ctx.strokeStyle='rgba(143,213,255,.28)';ctx.strokeRect(lx-40,0,80,H);ctx.fillStyle='#172546';ctx.fillRect(lx-30,H-75,60,50);ctx.fillStyle='#61edff';ctx.fillRect(lx-38,H-5,76,5)}ctx.strokeStyle='#ff7bd9';ctx.shadowBlur=18;ctx.shadowColor='#ff3bc8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,HIT);ctx.lineTo(W,HIT);ctx.stroke();ctx.shadowBlur=0;for(const n of notes){const lx=90+n.lane*175;ctx.fillStyle=n.hit?'transparent':'#ff7bd9';ctx.shadowBlur=16;ctx.shadowColor='#ff43c7';ctx.beginPath();ctx.arc(lx,n.y,14,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff4ff';ctx.beginPath();ctx.arc(lx,n.y,5,0,7);ctx.fill()}for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1}if(active&&combo>=2){ctx.font='900 24px monospace';ctx.textAlign='center';ctx.fillStyle='#ffe45e';ctx.fillText(combo+' HIT',W/2,100)}}
function pressKey(i){keys[i]=true;$(`[data-lane="${i}"]`).classList.add('active');hit(i)}function releaseKey(i){keys[i]=false;$(`[data-lane="${i}"]`).classList.remove('active')}
const map={d:0,f:1,j:2,k:3};addEventListener('keydown',e=>{const i=map[e.key.toLowerCase()];if(i!==undefined&&!keys[i])pressKey(i)});addEventListener('keyup',e=>{const i=map[e.key.toLowerCase()];if(i!==undefined)releaseKey(i)});document.querySelectorAll('.key').forEach(b=>{const i=+b.dataset.lane;b.addEventListener('pointerdown',e=>{e.preventDefault();pressKey(i)});b.addEventListener('pointerup',()=>releaseKey(i));b.addEventListener('pointercancel',()=>releaseKey(i))});function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}tap($('start'),reset);tap($('again'),reset);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');requestAnimationFrame(tick);draw();if(location.search.includes('debug=1'))window.__BEAT={get active(){return active},get score(){return score},get combo(){return combo},get notes(){return notes.length}};
</script></body></html>
