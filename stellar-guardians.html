<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星域守护者</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#010206;color:#a8d4ff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#01040e}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(94vw,740px);display:flex;justify-content:space-between;font:800 13px monospace;color:#4aa8ff;text-shadow:0 0 8px #2de0ff}.back{position:fixed;right:12px;top:10px;z-index:6;border:1px solid #3defff;border-radius:999px;background:#0b3d5a;color:#fff;padding:8px 12px;font-weight:800}.controls{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:6;display:flex;gap:12px}.control{width:74px;height:47px;border:1px solid #3defff;border-radius:14px;background:#0f2f45;color:#e0ffff;font-weight:900;touch-action:none;user-select:none}.control:active,.control.on{background:#176d87}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:11px;left:10px;z-index:8;padding:7px 11px;border:1px solid #3defff;border-radius:999px;background:#0b2934ee;color:#dffcff;font:11px monospace}}.panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03050ddd;text-align:center}.box{width:min(90vw,440px);padding:30px;border:1px solid #3defff;border-radius:21px;background:linear-gradient(145deg,#0d2b44,#070b18);box-shadow:0 0 45px #1fb9ff55}.box h1{margin:0;color:#7fffd4;font-size:clamp(38px,10vw,68px);text-shadow:0 0 16px #2cffef}.box p{color:#a8c8d8;line-height:1.7}.start{padding:12px 24px;border:1px solid #ffe15e;border-radius:999px;background:#6b5113;color:#fff4b6;font-weight:900;font-size:15px}.hidden{display:none!important}.tip{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:4;color:#7fb3c8;font:11px monospace;white-space:nowrap}
</style></head><body><div id="app"><canvas id="game" width="720" height="405"></canvas><div class="hud"><span id="score">SCORE 00000</span><span id="lives">LIVES 3</span><span id="wave">WAVE 1</span><span id="best">BEST 00000</span></div><button class="back" id="back">返回星港</button><div class="tip">拖拽/点击防御塔 · 点击开始关卡 · 保护星港核心</div><div class="controls"><button class="control" data-k="left">◀</button><button class="control" data-k="fire">暂停</button><button class="control" data-k="right">▶</button></div><div id="title" class="panel"><div class="box"><h1>星域守护者</h1><p>STELLAR GUARDIANS<br>保护星港免受异星入侵。</p><button class="start" id="start">开始防御</button><p>拖拽防御塔到网格中 · 支持鼠标和触屏操作<br>每波敌机攻击，保护星港核心并赚取积分。</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>防御失败</h1><p id="result"></p><button class="start" id="again">再来一局</button><button class="start" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=720,H=405,$=id=>document.getElementById(id);let active=false,last=0,score=0,lives=3,wave=1,best=Number(localStorage.stellarGuardiansBest||0),towerPrice={'laser':100,'missile':200,'shield':150},towers=[],enemies=[],bullets=[],particles=[],placed=false,selectedTower=null,dragging=false;function reset(){active=true;last=performance.now();score=0;lives=3;wave=1;towers=[];enemies=[];bullets=[];particles=[];placed=false;selectedTower=null;dragging=false;$('title').classList.add('hidden');$('over').classList.add('hidden');hud();}
function hud(){$('score').textContent='SCORE '+String(Math.floor(score)).padStart(5,'0');$('lives').textContent='LIVES '+lives;$('wave').textContent='WAVE '+String(wave).padStart(2,'0');$('best').textContent='BEST '+String(Math.floor(best)).padStart(5,'0');}
function finish(){active=false;best=Math.max(best,score);localStorage.stellarGuardiansBest=best;$('result').textContent='得分 '+Math.floor(score)+' · 波次 '+wave+' · 最高 '+Math.floor(best);$('over').classList.remove('hidden');}
function spawnEnemy(){const type=Math.random();let ex,eney;let hp=30;if(type<0.4){ex=Math.random()*W/2;eney=-20;hp=15}else if(type<0.7){ex=W/2+Math.random()*W/3;eney=-20;hp=30}else{ex=W/2;eney=-20;hp=50}enemies.push({x:ex,y:eney,hp,hpMax:hp,w:type==='boss'?30:24,h:type==='boss'?25:20,vx:type==='boss'?0:Math.random()*60-30,vy:Math.random()*2+80,type});}
function update(dt){for(const e of enemies){e.x+=e.vx;e.y+=e.vy;if(e.y>H){if(e.type==='boss')lives--;else lives-=3;finish();return}for(const b of bullets){if(Math.hypot(e.x-b.x,e.y-b.y)<e.w+5){e.hp--;if(e.hp<=0){enemies=enemies.filter(q=>q!==e);score+=e.type==='boss'?500:100;}}bullets=bullets.filter(q=>q!==b)}}enemies=enemies.filter(e=>e.hp>0);if(enemies.length===0){wave++;spawnEnemies();}
function spawnEnemies(){for(let i=0;i<wave+3;i++)spawnEnemy();}
function drawGrid(){ctx.strokeStyle='rgba(100,200,255,.12)';ctx.lineWidth=1;for(let x=80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=40;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawTower(t,x,y){ctx.fillStyle=t==='laser'?'#4adeff':t==='missile'?'#ff7575':t==='shield'?'#7fffd4':'#fff';ctx.shadowBlur=15;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(x-28,y-28,56,56);ctx.shadowBlur=0;ctx.fillStyle='#0a1f33';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(t, x, y+5);ctx.textAlign='left';}
function draw(){ctx.fillStyle='#01040e';ctx.fillRect(0,0,W,H);drawGrid();for(const p of particles){p.t+=dt;ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}
for(const t of towers){const {x,y}=t;drawTower(t,x,y);if(active){for(const e of enemies){if(Math.hypot(e.x-x,e.y-y)<t.w+e.w){if(t==='laser'){bullets.push({x:x+Math.sin(Date.now()/300)*40,y:y+50,vx:0,vy:-450});break}if(t==='missile'){const dx=e.x-x,dy=e.y-y,angle=Math.atan2(dy,dx);bullets.push({x,y,vx:Math.cos(angle)*400,vy:Math.sin(angle)*400});break}if(t==='shield'){const a=e.x-x,b=e.y-y,dist=Math.hypot(a,b);if(dist<e.w+60){e.vx+=a/dist*10;e.vy+=b/dist*10}}}}}}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-10){bullets=bullets.filter(q=>q!==b)}for(const e of enemies){if(Math.hypot(e.x-b.x,e.y-b.y)<e.w+5){e.hp--;bullets=bullets.filter(q=>q!==b);score+=e.type==='boss'?200:20;}}}for(const e of enemies){ctx.fillStyle=e.type==='boss'?'#ff5bc8':'#7df6ff';ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(Math.floor(e.hp),e.x,e.y+5);ctx.textAlign='left'}}function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;if(active)update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')selectedTower='laser';if(k==='arrowright'||k==='d')selectedTower='missile';if(k===' ')placedTower();});
document.querySelectorAll('.control').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='left')selectedTower='laser';if(k==='right')selectedTower='missile';if(k==='fire')placedTower();});});function placedTower(){if(!selectedTower||!active)return;if(score>=towerPrice[selectedTower]){towers.push({type:selectedTower,x:W/2,y:H/2});score-=towerPrice[selectedTower];selectedTower=null;}}
cv.addEventListener('click',e=>{if(active){const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left;const my=e.clientY-rect.top;if(mx>=80&&mx<W&&my>=40&&my<H){placedTower();return}for(const t of towers){if(Math.hypot(mx-t.x,my-t.y)<30){selectedTower=t.type;break}}}}
});
function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}
tap($('start'),()=>{if(!placed){placed=true;for(let i=0;i<3;i++)spawnEnemy();}});
tap($('again'),reset);
tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');
tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');
requestAnimationFrame(loop);draw();
</script></body></html>
