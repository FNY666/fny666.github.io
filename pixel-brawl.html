<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素乱斗 PIXEL BRAWL</title>
<meta name="theme-color" content="#0a1024">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="像素乱斗">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css?v=17">
<!-- v62 字体：展示 ZCOOL庆科黄油体 / UI Noto Sans SC / 数字 Rajdhani（OFL 免费商用） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* v62 标题界面重制：金字 Logo + 暗金按钮 */
#title h1 {
  font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif;   /* v62 展示字体 */
  font-size: clamp(48px, 14vw, 96px);
  font-weight: 900;
  letter-spacing: .12em;
  background: linear-gradient(180deg, #fff3b0 0%, #ffd83a 35%, #ff9a3c 70%, #ff6b2e 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 2px 0 #3a1400) drop-shadow(0 6px 16px rgba(0,0,0,.6));
  margin: 10px 0 4px;
}
#title .sub {
  letter-spacing: .6em; color: #ffd83a; font-size: 13px;
  text-shadow: 0 2px 6px rgba(0,0,0,.7); margin-bottom: 10px;
}
#title button {
  font-family: 'Noto Sans SC', sans-serif;   /* v62 UI 字体 */
  background: rgba(12,16,32,.78);
  border: 1px solid #c89a30;
  color: #ffe95c;
  letter-spacing: .2em;
  transition: box-shadow .15s, transform .1s;
}
#title button:hover, #title button:active {
  box-shadow: 0 0 14px rgba(255,216,58,.55), inset 0 0 8px rgba(255,216,58,.15);
  transform: translateY(-1px);
}
#title #btn-start {
  font-size: 20px; padding: 12px 42px;
  border-width: 2px;
  background: linear-gradient(180deg, rgba(60,40,10,.85), rgba(20,14,6,.85));
}
#title .char-card.selected { border-color: #ffd83a; box-shadow: 0 0 16px rgba(255,216,58,.5); }
#title .help { color: #b8c8e0; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
/* v74 性能审计：76px 大键 / 弧形排布 / 高对比 / 连招键金色（覆盖共享 style.css，仅本测试页） */
#touch .tk { width:76px; height:76px; font-size:22px; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.42); }
#touch .tk:active { background:rgba(255,210,80,.45); }
.tc-left .tk:nth-child(1){ left:3vw; bottom:3vh; }
.tc-left .tk:nth-child(2){ left:calc(3vw + 88px); bottom:3vh; }
.tc-left .tk:nth-child(3){ left:calc(3vw + 176px); bottom:3vh; }
.tc-left .tk:nth-child(4){ left:calc(3vw + 44px); bottom:calc(3vh + 88px); }
.tc-right .tk:nth-child(1){ right:calc(3vw + 176px); bottom:3vh; }
.tc-right .tk:nth-child(2){ right:calc(3vw + 88px); bottom:3vh; }
.tc-right .tk:nth-child(3){ right:3vw; bottom:3vh; }
.tc-right .tk:nth-child(4){ right:calc(3vw + 44px); bottom:calc(3vh + 88px); }
#touch .tk-combo { border-color:rgba(255,200,60,.8); color:#ffd76a; background:rgba(120,70,0,.30); font-weight:700; }
@media (max-width:480px) {
  #touch .tk { width:56px; height:56px; font-size:16px; }
  .tc-left .tk:nth-child(1){ left:3vw; bottom:2vh; }
  .tc-left .tk:nth-child(2){ left:calc(3vw + 64px); bottom:2vh; }
  .tc-left .tk:nth-child(3){ left:calc(3vw + 128px); bottom:2vh; }
  .tc-left .tk:nth-child(4){ left:calc(3vw + 32px); bottom:calc(2vh + 64px); }
  .tc-right .tk:nth-child(1){ right:calc(3vw + 128px); bottom:2vh; }
  .tc-right .tk:nth-child(2){ right:calc(3vw + 64px); bottom:2vh; }
  .tc-right .tk:nth-child(3){ right:3vw; bottom:2vh; }
  .tc-right .tk:nth-child(4){ right:calc(3vw + 32px); bottom:calc(2vh + 64px); }
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="270"></canvas>

  <!-- 标题画面 -->
  <div id="title" class="panel">
    <h1>像素乱斗</h1>
    <p class="sub">PIXEL BRAWL · 复古格斗</p>
    <button id="btn-start">开始战斗</button>
    <button id="btn-arcade" class="btn-alt">街机模式</button>
    <button id="btn-endless" class="btn-alt">无尽模式</button>
    <button id="btn-pvp" class="btn-alt">双人对战</button>
    <button id="btn-training" class="btn-alt">训练模式</button>
    <div class="char-select">
      <button id="char-fighter" class="char-card selected">
        <span class="cc-side side-h">英雄</span>
        <span class="cc-name">小烈</span>
        <span class="cc-desc">均衡 · 速度型</span>
      </button>
      <button id="char-blob" class="char-card">
        <span class="cc-side side-h">英雄</span>
        <span class="cc-name">阿蓝</span>
        <span class="cc-desc">重装 · 血厚攻高</span>
      </button>
      <button id="char-huntress" class="char-card">
        <span class="cc-side side-h">英雄</span>
        <span class="cc-name">小芸</span>
        <span class="cc-desc">灵巧 · 长枪游击</span>
      </button>
      <button id="char-wizard" class="char-card">
        <span class="cc-side side-v">反派</span>
        <span class="cc-name">墨巫</span>
        <span class="cc-desc">秘法 · 重炮法师</span>
      </button>
      <button id="char-random" class="char-card char-random">
        <span class="cc-side side-r">?</span>
        <span class="cc-name">随机</span>
        <span class="cc-desc">🎲 交给命运</span>
      </button>
    </div>
    <div class="diff-select">
      <button id="diff-easy" class="diff-card">简单</button>
      <button id="diff-normal" class="diff-card selected">普通</button>
      <button id="diff-hard" class="diff-card">困难</button>
    </div>
    <div class="help">
      <b>1P 键盘</b>：A/D 移动 · W 跳 · S 格挡 · J 拳 · K 脚 · L 波动拳 · P 暂停<br>
      <b>2P 键盘</b>：方向键 移动/跳 · ↓ 格挡 · 4/5/6 拳/脚/波<br>
      <b>连招</b>：拳×3 三连击 · 空中按拳 · 能量满时波动拳=超必杀<br>
      <b>无尽</b>：无限波次，击败一个再来一个
    </div>
  </div>

  <!-- 结算画面 -->
  <div id="result" class="panel hidden">
    <h2 id="result-text">K.O.</h2>
    <p id="result-detail"></p>
    <button id="btn-rematch">再来一局</button>
  </div>

  <!-- 暂停菜单 -->
  <div id="pause" class="panel hidden">
    <h2>暂停</h2>
    <div class="diff-select">
      <button id="pdiff-easy" class="diff-card">简单</button>
      <button id="pdiff-normal" class="diff-card">普通</button>
      <button id="pdiff-hard" class="diff-card">困难</button>
    </div>
    <button id="btn-resume">继续</button>
    <button id="btn-restart">重开本局</button>
    <button id="btn-quit" class="btn-alt">返回标题</button>
  </div>
  <button id="btn-pause" class="icon-btn hidden" aria-label="暂停" title="暂停">Ⅱ</button>
  <button id="btn-mute" class="icon-btn" aria-label="静音" title="静音(M)">♪</button>
  <button id="btn-fullscreen" class="icon-btn" aria-label="全屏" title="全屏">⛶</button>

  <!-- 手机竖屏旋转提示 -->
  <div id="rotate-hint">横屏游玩体验更佳 <span class="rt-arrow">⟳</span></div>

  <!-- 输入监视器（?debug=1 时显示，绿色=该键当前被系统识别按下） -->
  <div id="inp-monitor" class="inp-monitor hidden"></div>

  <!-- 连段挑战面板（训练模式） -->
  <div id="trial-panel" class="trial-panel hidden">
    <div class="trial-title">连段挑战</div>
    <div id="trial-list"></div>
    <div id="trial-status" class="trial-status"></div>
    <div id="frame-data" class="frame-data"></div>
    <div id="dummy-mode" class="dummy-mode">假人：站立（T 切换）</div>
    <div class="dummy-btns">
      <button id="dummy-stand" class="diff-card selected">站立</button>
      <button id="dummy-guard" class="diff-card">格挡</button>
      <button id="dummy-jump" class="diff-card">跳跃</button>
    </div>
    <div id="move-list" class="move-list"></div>
    <div id="train-stats" class="train-stats"></div>
  </div>

  <!-- 触屏控制（1P 下部 / 2P 上部，div + 容器级事件委托） -->
  <div id="touch" class="hidden">
    <div id="tc-2p" class="tc-2p hidden">
      <div class="tc-2p-left">
        <div class="tk2" data-k="left">◀</div>
        <div class="tk2" data-k="right">▶</div>
        <div class="tk2" data-k="jump">跳</div>
        <div class="tk2" data-k="block">防</div>
      </div>
      <div class="tc-2p-right">
        <div class="tk2" data-k="punch">拳</div>
        <div class="tk2" data-k="kick">脚</div>
        <div class="tk2" data-k="special">波</div>
      </div>
    </div>
    <div class="tc-left">
      <div class="tk" data-k="left">◀</div>
      <div class="tk" data-k="right">▶</div>
      <div class="tk" data-k="jump">跳</div>
      <div class="tk" data-k="block">防</div>
    </div>
    <div class="tc-right">
      <div class="tk" data-k="punch">拳</div>
      <div class="tk" data-k="kick">脚</div>
      <div class="tk" data-k="special">波</div>
      <div class="tk tk-combo" data-k="combo">连</div>
    </div>
  </div>
</div>
<script>
// PWA：支持时注册离线缓存（minis:// 等特殊协议下自动跳过）
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script src="game.js?v=75"></script>
</body>
</html>
