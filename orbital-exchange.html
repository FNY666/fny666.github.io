<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>轨道商会</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05060d;color:#eafaff;font-family:system-ui,-apple-system,PingFang SC,sans-serif}#app{height:100%;position:relative;display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 16/9));height:min(100vh,calc(100vw * 9/16));image-rendering:pixelated;background:#070b1c}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2;width:min(95vw,760px);display:flex;justify-content:space-between;gap:8px;font:800 12px monospace;color:#b7f8ff;text-shadow:0 0 8px #20dfff}.panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(2,5,14,.86);text-align:center}.box{width:min(90vw,450px);padding:28px 30px;border:1px solid #64edff;border-radius:20px;background:linear-gradient(145deg,rgba(10,26,57,.98),rgba(4,8,20,.98));box-shadow:0 0 45px #168fab44}.box h1{margin:0;font-size:clamp(38px,10vw,72px);color:#78f4ff;text-shadow:0 0 16px #15dfff}.box p{color:#a9c3de;line-height:1.8}.btn,.back,.trade{font:inherit;font-weight:800;color:#eaffff;background:#0b506a;border:1px solid #67edff;border-radius:999px}.btn{display:block;margin:12px auto;padding:13px 30px;font-size:16px}.hidden{display:none!important}.back{position:fixed;right:12px;top:10px;z-index:6;padding:8px 13px;font-size:12px}.panel-ui{position:fixed;right:14px;bottom:14px;z-index:4;width:210px;padding:10px;border:1px solid #3e7697;border-radius:12px;background:#071529dd;font:11px monospace;color:#aacce0}.panel-ui select,.panel-ui button{width:100%;margin-top:6px;padding:8px}.trade{padding:8px}.log{height:48px;margin-top:6px;color:#7ee9ff;overflow:hidden}.rotate{display:none}@media(orientation:portrait) and (pointer:coarse){.rotate{display:block;position:fixed;top:12px;z-index:7;padding:8px 14px;border:1px solid #67edff;border-radius:999px;background:#0b2139dd;font-size:12px}}
</style></head><body><div id="app"><canvas id="game" width="800" height="450"></canvas><div class="hud"><span id="credits">CREDITS 1000</span><span id="cargo">CARGO 0/6</span><span id="fuel">FUEL 100%</span><span id="day">DAY 01</span></div><button class="back" id="back">返回星港</button><div class="panel-ui"><b id="route">当前位置：曙光站</b><select id="goods"><option value="0">量子晶体</option><option value="1">冷冻食物</option><option value="2">星尘燃料</option></select><select id="dest"></select><button class="trade" id="buy">装货 / 购买</button><button class="trade" id="travel">跃迁到目标站</button><button class="trade" id="sell">卸货 / 出售</button><div class="log" id="log">选择商品，寻找价差。</div></div><div class="rotate">横屏进行星际贸易 ⟳</div><div id="title" class="panel"><div class="box"><h1>轨道商会</h1><p>ORBITAL EXCHANGE<br>在星港之间寻找真正的价格差</p><button class="btn" id="start">进入交易航线</button><p>选择商品 → 购买 → 跃迁 → 出售<br>货舱与燃料有限，路线要精打细算</p></div></div><div id="over" class="panel hidden"><div class="box"><h1>航线结算</h1><p id="result"></p><button class="btn" id="again">重新开航</button><button class="btn" id="hall">返回星港</button></div></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=800,H=450,$=id=>document.getElementById(id);let active=false,last=0,credits=1000,cargo=0,fuel=100,day=1,here=0,target=1,goods=0,best=Number(localStorage.orbitalExchangeBest||0),ship={x:0,y:0},stars=[];
const stations=[{name:'曙光站',x:150,y:255,color:'#ffe35d'},{name:'云环港',x:385,y:125,color:'#72e9ff'},{name:'暮光城',x:650,y:270,color:'#ff79c8'},{name:'深空坞',x:470,y:350,color:'#a48cff'}];
const items=[{name:'量子晶体',base:120},{name:'冷冻食物',base:70},{name:'星尘燃料',base:95}];
let prices=[];function makePrices(){prices=stations.map((s,si)=>items.map((it,gi)=>Math.max(18,Math.round(it.base*(.62+((si*37+gi*53)%90)/100)))))}
function reset(){active=true;last=performance.now();credits=1000;cargo=0;fuel=100;day=1;here=0;target=1;goods=0;ship={x:stations[0].x,y:stations[0].y};makePrices();fillDest();$('title').classList.add('hidden');$('over').classList.add('hidden');log('选择商品并购买货物');hud()}
function hud(){$('credits').textContent='CREDITS '+String(Math.floor(credits)).padStart(4,'0');$('cargo').textContent='CARGO '+cargo+'/6';$('fuel').textContent='FUEL '+Math.ceil(fuel)+'%';$('day').textContent='DAY '+String(day).padStart(2,'0');$('route').textContent='当前位置：'+stations[here].name}
function log(s){$('log').textContent=s}
function fillDest(){const d=$('dest');d.innerHTML='';stations.forEach((s,i)=>{if(i!==here){const o=document.createElement('option');o.value=i;o.textContent=s.name+' · '+prices[i][goods]+'c';d.appendChild(o)}});target=+d.value||stations.findIndex((_,i)=>i!==here)}
function buy(){if(!active)return;if(cargo>=6){log('货舱已满');return}const p=prices[here][goods];if(credits<p){log('资金不足，需要 '+p+' credits');return}credits-=p;cargo++;log('装载 '+items[goods].name+' · 买入价 '+p+'c');hud()}
function travel(){if(!active||here===target)return;if(cargo===0){log('没有货物，先购买再跃迁');return}const a=stations[here],b=stations[target],dist=Math.hypot(a.x-b.x,a.y-b.y),cost=Math.ceil(dist/6);if(fuel<cost){log('燃料不足，需要 '+cost+'%');return}fuel-=cost;here=target;day++;ship={x:stations[here].x,y:stations[here].y};fillDest();log('抵达 '+stations[here].name+' · 航程消耗 '+cost+'%');hud()}
function sell(){if(!active||cargo===0){log('货舱没有货物');return}const buyP=prices[here][goods];const origin=items[goods].base;const sellP=Math.round(buyP* (1.05+((here*41+goods*29)%110)/100));const gain=(sellP-buyP)*cargo;credits+=Math.max(0,gain);best=Math.max(best,credits);localStorage.orbitalExchangeBest=best;log('卖出 '+cargo+' 单位 · '+(gain>=0?'+':'')+gain+' credits');cargo=0;fuel=Math.min(100,fuel+12);hud();if(day>=12||credits>=2200)end()}
function end(){active=false;$('result').textContent='资产 '+Math.floor(credits)+' · 航行 '+day+' 天 · 最高 '+best;$('over').classList.remove('hidden')}
function draw(){ctx.fillStyle='#050918';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(420,220,20,420,220,500);g.addColorStop(0,'#172852');g.addColorStop(1,'#050817');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<80;i++){ctx.fillStyle=i%9?'#40558c':'#fff';ctx.fillRect((i*97)%W,(i*53)%390,i%9?1:2,i%9?1:2)}ctx.strokeStyle='rgba(100,215,255,.12)';ctx.lineWidth=2;for(let i=0;i<stations.length;i++)for(let j=i+1;j<stations.length;j++){ctx.beginPath();ctx.moveTo(stations[i].x,stations[i].y);ctx.lineTo(stations[j].x,stations[j].y);ctx.stroke()}ctx.setLineDash([5,7]);ctx.strokeStyle='#ffe35d';ctx.beginPath();ctx.moveTo(stations[here].x,stations[here].y);ctx.lineTo(stations[target].x,stations[target].y);ctx.stroke();ctx.setLineDash([]);for(const s of stations){ctx.fillStyle=s.color;ctx.shadowBlur=18;ctx.shadowColor=s.color;ctx.beginPath();ctx.arc(s.x,s.y,16,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText(s.name,s.x,s.y+34)}ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(ship.x+22,ship.y);ctx.lineTo(ship.x-12,ship.y-11);ctx.lineTo(ship.x-8,ship.y);ctx.lineTo(ship.x-12,ship.y+11);ctx.closePath();ctx.fill();ctx.fillStyle='#ff67c7';ctx.fillRect(ship.x-4,ship.y-4,8,8);ctx.textAlign='left';ctx.fillStyle='#a7d7ed';ctx.font='12px monospace';ctx.fillText('MARKET '+items[goods].name+' BUY '+prices[here][goods]+'c',16,H-20)}
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(active){draw()}else draw();requestAnimationFrame(loop)}
$('goods').onchange=()=>{goods=+$('goods').value;fillDest();log('切换商品：'+items[goods].name);};$('dest').onchange=()=>target=+$('dest').value;
function tap(el,fn){let t=0;const go=()=>{const n=Date.now();if(n-t>80){t=n;fn()}};el.addEventListener('pointerup',go);el.addEventListener('click',go)}tap($('start'),reset);tap($('again'),reset);tap($('buy'),buy);tap($('travel'),travel);tap($('sell'),sell);tap($('back'),()=>location.href='https://fny666.github.io/arcade.html');tap($('hall'),()=>location.href='https://fny666.github.io/arcade.html');makePrices();fillDest();ship={x:stations[0].x,y:stations[0].y};requestAnimationFrame(loop);
</script></body></html>
